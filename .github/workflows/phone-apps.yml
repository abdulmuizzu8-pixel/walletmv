# Builds the WalletMV phone apps (Android and iPhone) in the cloud with Expo (EAS).
# Run it from GitHub → Actions → "Build the phone apps" → Run workflow.
#
# One-time setup (see store-listing/README.md):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   EXPO_TOKEN = an access token from expo.dev → Account settings → Access tokens
# The first iPhone build must be done once from a computer, because it needs your Apple login.
name: Build the phone apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [android, ios, all]
        default: android
      send_to_store:
        description: Send to the store when the build finishes (Google Play internal testing / TestFlight)
        type: boolean
        default: false

concurrency:
  group: phone-apps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-expo
    steps:
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub → Settings → Secrets and variables → Actions (see store-listing/README.md)"
            exit 1
          fi
        working-directory: .

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Match package versions to the Expo SDK
        run: npx expo install --fix

      - name: Link to the Expo project (@muisssss-team/walletmv)
        run: eas init --non-interactive --force

      - name: Build
        run: >
          eas build
          --platform ${{ inputs.platform }}
          --profile production
          --non-interactive
          --no-wait
          ${{ inputs.send_to_store && '--auto-submit' || '' }}

      - name: Where to find it
        run: echo "Builds are running on Expo. Open expo.dev → walletmv → Builds to watch them and download the files."
