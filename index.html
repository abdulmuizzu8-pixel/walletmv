function seedSaleLines(){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const rate={1:18,2:6,3:2.5,4:0.9,5:0.35,6:0.05};const out=[];
 for(let back=59;back>=0;back--){const d=isoD(new Date(today.getFullYear(),today.getMonth(),today.getDate()-back));
  S.products.forEach(p=>{const r=rate[p.id]||0;let q=r>=1?Math.round(r*(0.6+rnd()*0.8)):(rnd()<r?1:0);if(q>0)out.push({d,pid:p.id,qty:q,price:p.price,cost:p.cost})})}
 return out}

const SKIP_RE=/total|sub ?total|tax|gst|vat|change|cash|card|balance|discount|\btel\b|phone|invoice|receipt|date|time|thank|amount|paid|due|tin|bill no|qty|price/i;
function parseReceipt(text){const out=[];
 String(text||'').split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(l=>{
  if(SKIP_RE.test(l)||!/[a-z]{2}/i.test(l))return;
  const m=l.match(/^(.*?[a-z].*?)\s+(?:mvr|rf|\$)?\s*(\d[\d,]*(?:\.\d{1,2})?)\s*$/i);if(!m)return;
  let name=m[1].trim(),total=parseFloat(m[2].replace(/,/g,''));if(!(total>0)||total>500000)return;
  let qty=1;const q=name.match(/^(\d{1,3})\s*[x×*]?\s+(.+)$/i)||name.match(/^(.+?)\s+(\d{1,3})\s*[x×*@]\s*[\d.]*$/i);
  if(q){if(/^\d/.test(q[1])){qty=+q[1];name=q[2]}else{name=q[1];qty=+q[2]}}
  name=name.replace(/[^\w\s&'\-().\/]/g,'').trim().slice(0,48);if(name.length<2)return;
  out.push({name,qty:qty||1,price:Math.round(total/(qty||1)*100)/100,on:true})});
 return out}
/* What a scanned bill says besides its items: the total, who it's from and the date. */
function receiptMeta(text){const t=String(text||''),lines=t.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
 const tm=t.match(/(?:grand\s*)?total[^\d\n]*(\d[\d,]*(?:\.\d{1,2})?)/i),total=tm?parseFloat(tm[1].replace(/,/g,'')):0;
 const who=(lines.find(l=>/[a-z]{3}/i.test(l)&&!SKIP_RE.test(l))||'').replace(/[^\w\s&'\-().\/]/g,'').trim().slice(0,48);
 let date='';const dm=t.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/)||t.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/);
 if(dm){let y,m,d;if(dm[1].length===4){y=+dm[1];m=+dm[2];d=+dm[3]}else{d=+dm[1];m=+dm[2];y=+dm[3];if(y<100)y+=2000}
  const iso=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ok=m>=1&&m<=12&&d>=1&&d<=31&&!isNaN(new Date(iso+'T00:00'));if(ok&&iso<=isoD(today)&&iso>=addDays(isoD(today),-400))date=iso}
 return {total:total>0&&total<10000000?Math.round(total*100)/100:0,who,date:date||isoD(today),gst:/\b(gst|tgst|tax invoice|tin\b|vat)\b/i.test(t)}}
const scanSum=r=>Math.round(r.items.filter(i=>i.on&&i.qty>0).reduce((a,i)=>a+i.qty*(i.price||0),0)*100)/100;
function scanItems(file,target){if(!file)return;if(!canScan())return toast('Scanning comes with Muraka, Atholhu and Dhoni');

 S.scanDone=null;S.scanReview={...base,status:'reading'};render();
 if(typeof Tesseract==='undefined'){S.scanReview={...base,status:'failed'};render();return}
 Tesseract.recognize(file,'eng').then(({data:{text}})=>{const items=parseReceipt(text),m=receiptMeta(text);S.scanReview={...base,...m,status:items.length?'ready':'empty',items};if(!S.scanReview.total)S.scanReview.total=scanSum(S.scanReview);render()})

function scanEdit(k,f,v){const r=S.scanReview,it=r&&r.items[k];if(!it)return;const before=scanSum(r);it[f]=f==='name'?v:f==='on'?v:Math.max(0,+v||0);

 if(r.target==='inv')return r.rec==='sold'?`Take ${it} off stock${tot?' + save '+tot+' sale':''}`:r.rec==='bought'?`Add ${it} to stock${tot?' + save '+tot+' expense':''}`:`Add ${it} to stock`;

const sameItem=(a,b)=>{a=a.trim().toLowerCase();b=b.trim().toLowerCase();if(a===b)return true;const s1=a.length<b.length?a:b,l=a.length<b.length?b:a;return s1.length>=3&&new RegExp('(^|\\s)'+s1.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\s|$)').test(l)};

 if(money_&&!(total>0))return toast('Enter the bill total, or choose not to save it as money');
 const date=/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&r.date<=isoD(today)?r.date:isoD(today),who=String(r.who||'').trim().slice(0,60);
 const ops={target:r.target,stock:[],home:[],tx:null,shopTx:null};let added=0,updated=0,missing=0;

   if(rec==='sold'){if(!p){missing++;return}const take=Math.min(p.stock,q);p.stock-=take;ops.stock.push({pid:p.id,qty:-take,created:false});updated++;return}
   if(p){p.stock+=q;ops.stock.push({pid:p.id,qty:q,created:false,cost:p.cost});if(i.price)p.cost=i.price;updated++}
   else{const id=Math.max(0,...S.products.map(x=>x.id))+1;p={id,name:i.name.trim(),sku:'SC'+String(id).padStart(3,'0'),price:Math.round((i.price||0)*1.25),cost:i.price||0,stock:q,supplierId:null};S.products.push(p);ops.stock.push({pid:id,qty:q,created:true});added++}});

function alertsNow(){const out=[],add=(rule,text)=>{if(ruleOn(rule))out.push({rule,text})},dago=n=>isoD(new Date(today.getTime()-n*864e5));

 const i=subInfo();if(i.state==='active'&&i.left<=5)add('expiring',`${S.name}'s ${i.p.short} package ends in ${i.left} day${i.left===1?'':'s'} (${ld(i.end)}).`);
 if(i.state==='expired')add('expired',`${S.name}'s ${i.p.short} package ended on ${ld(i.end)}.`);
 S.issues.filter(x=>x.status==='open'&&x.date<=dago(2)).forEach(x=>add('issue_old',`Problem ${x.ref} (${x.cat}) from ${x.by} is still open since ${ld(x.date)}.`));
 (S.partners||[]).filter(x=>x.status==='pending').forEach(x=>add('partner',`${x.business} sent a loyalty offer to review.`));
 if(S.shared&&S.shared.length>seatLimit())add('seats',`${S.name}'s wallet has ${S.shared.length} people but the package allows ${seatLimit()}.`);
 (S.products||[]).filter(p=>{try{return needsReorder(p)}catch(e){return false}}).forEach(p=>add('low_stock',`${p.name}: only ${p.stock} left — reorder ${reorderQty(p)}.`));
 try{const r=shopCalc().rolling;if(r>=900000)add('gst',`Shop sales in the last 12 months are ${money(r)} — GST registration is needed at MVR 1,000,000.`)}catch(e){}
 try{const m=calc(curMk()),lim=S.budget.limit;if(lim>0&&m.exp>=lim*.9)add('budget',`${S.name} has used ${Math.round(m.exp/lim*100)}% of this month's budget.`)}catch(e){}
 S.errLog.slice(0,5).forEach(e=>add('error',`App error on ${e.page}: ${e.msg}`));

const EXP_HINTS=[[/stelco|electric|fenaka|water|mwsc/i,'Utilities'],[/ooredoo|dhiraagu|internet|broadband|mobile/i,'Utilities'],[/rent|lease/i,'Rent'],[/salary|wage/i,'Staff wages'],[/fuel|petrol|diesel|ferry|taxi|transport/i,'Transport'],[/repair|service|maintenance/i,'Repairs']];
function readBill(text){const t=String(text||''),lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
 const tl=lines.filter(l=>/total|amount due|balance due/i.test(l)&&!/sub\s*-?\s*total/i.test(l)).map(l=>l.match(/(\d[\d,]*(?:\.\d{1,2})?)\s*$/)).filter(Boolean);const tm=tl.length?tl[tl.length-1]:null;const nums=[...t.matchAll(/\d[\d,]*\.\d{2}/g)].map(m=>parseFloat(m[0].replace(/,/g,''))).filter(n=>n>0&&n<5000000);
 const total=tm?parseFloat(tm[1].replace(/,/g,'')):(nums.length?Math.max(...nums):0);
 const gstM=t.match(/(?:gst|tgst|vat|tax)[^\d\n]*?(\d+(?:\.\d+)?)\s*%?[^\d\n]*(\d[\d,]*\.\d{2})?/i);
 const hasGst=/\b(gst|tgst|tax invoice|tin\b|vat)\b/i.test(t);const tin=(t.match(/\bTIN[:#\s]*([A-Z0-9-]{6,})/i)||[])[1]||'';
 const from=(lines.find(l=>/[a-z]{3}/i.test(l)&&!SKIP_RE.test(l))||'Unknown').slice(0,48);
 const items=parseReceipt(t);const mine=S.shopProfile.name&&t.toLowerCase().includes(S.shopProfile.name.toLowerCase());
 const plain=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const tp=plain(t);const sup=S.suppliers.find(x=>{const w=plain(x.name.split(' ')[0]);return w.length>3&&tp.includes(w)});
 let type='expense',cat='Other';
 if(mine||/\b(sales receipt|bill to|invoice to|customer copy)\b/i.test(t))type='income',cat='Sales';
 else if(items.length>=2&&(sup&&!/ooredoo|dhiraagu|stelco/i.test(sup.name)||items.filter(i=>i.qty>1).length>=1||/wholesale|supplier|purchase|delivery note/i.test(t)))type='stock',cat='Stock/Inventory';
 else{const h=EXP_HINTS.find(([re])=>re.test(t));if(h)cat=h[1]}
 const conf=total>0?(type==='expense'&&cat==='Other'?'check':'ok'):'check';
 return{type,cat,total,gst:hasGst,gstAmt:gstM&&gstM[2]?parseFloat(gstM[2].replace(/,/g,'')):0,tin,from:sup?sup.name:from,supplierId:sup?sup.id:null,items,conf}}
function applyBill(b){const ops={tx:[],stock:[]};const date=isoD(today);
 if(b.type==='stock'){b.items.filter(i=>i.on!==false).forEach(i=>{let p=S.products.find(x=>sameItem(x.name,i.name));let created=false;
  if(!p){const id=Math.max(0,...S.products.map(x=>x.id))+1;p={id,name:i.name,sku:'SC'+String(id).padStart(3,'0'),price:Math.round((i.price||0)*1.25),cost:i.price||0,stock:0,supplierId:b.supplierId};S.products.push(p);created=true}
  p.stock+=Math.round(i.qty);if(i.price)p.cost=i.price;ops.stock.push({pid:p.id,qty:Math.round(i.qty),created})})}

 if(!name)return toast('Give the package a name');
 const fr=isVeli(p),trialDays=fr?Math.round(+(($('#ptr_'+id)||{}).value||p.trial||90)):0;
 if(!(price>0))return toast('Enter a price above zero');
 if(fr&&!(trialDays>=0&&trialDays<=365))return toast('Free days must be between 0 and 365');
 if(!(days>=1&&days<=366))return toast('Days must be between 1 and 366');
 if(!features.length)return toast('Add at least one feature, one per line');

 if(!on&&S.plans.filter(x=>x.on&&x.id!==id).length===0)return toast('Keep at least one package switched on');
 Object.assign(p,fr?{name,price,days,tag,features,on,members:1,scan:false,trial:trialDays}:{name,price,days,tag,features,on,members,scan});toast(name+' package saved');render()}

const isMV=()=>S.shopProfile.region!=='intl';
const taxName=()=>isMV()?'GST':(S.shopProfile.taxLabel||'Tax');
const taxRate=()=>isMV()?8:(+S.defaultGst||0);
function shopGst(amt){const r=taxRate();return r?amt*r/(100+r):0}
function taxRateOptions(sel){
 const opts=isMV()?[[0,'0% (not registered)'],[8,'8% (general)'],[17,'17% (tourism)']]
  :[0,5,7,8,10,12,15,16,18,20,21,23,25].map(r=>[r,r===0?'0% (no tax)':r+'%']);
 if(!opts.some(o=>o[0]===sel))opts.push([sel,sel+'%']);
 return opts.map(o=>`<option value="${o[0]}" ${sel===o[0]?'selected':''}>${o[1]}</option>`).join('')}
function setShopRegion(r){
 S.shopProfile.region=r;
 if(r==='MV'){if(![0,8,17].includes(S.defaultGst))S.defaultGst=8;if(![0,8,17].includes(S.inv.tax))S.inv.tax=S.defaultGst}
 else if(S.repView==='gst')S.repView='sales';
 toast(r==='MV'?'Maldives: GST tools switched on':'Outside the Maldives: GST tools hidden');render()}
function shopCalcMonth(month){const cM=S.shopTx.filter(t=>mk(t.date)===month);
 const incM=cM.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);
 const expM=cM.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amt,0);
 const outGst=cM.filter(t=>t.type==='income'&&t.gst).reduce((a,t)=>a+shopGst(t.amt),0);
 return{incM,expM,outGst};
}
function shopCalc(){
 const month=curMk();const cM=S.shopTx.filter(t=>mk(t.date)===month);
 const c=shopCalcMonth(month);
 const by={};cM.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const from365=dAgo(365);
 const rolling=S.shopTx.filter(t=>t.type==='income'&&t.date>=from365).reduce((a,t)=>a+t.amt,0);
 const inGst=cM.filter(t=>t.type==='expense'&&t.gst).reduce((a,t)=>a+shopGst(t.amt),0);
 return{incM:c.incM,expM:c.expM,by,rolling,outGst:c.outGst,inGst,net:c.outGst-inGst};
}
function shopSalesBars(){const mx=Math.max(1,...lastMonths(6).map(k=>shopCalcMonth(k).incM));
 return lastMonths(6).reverse().map(k=>{const cm=shopCalcMonth(k);return `<div><div class="pair"><i style="height:${Math.max(2,cm.incM/mx*100)}%;background:var(--gold)"></i><i style="height:${Math.max(2,cm.outGst/mx*100)}%;background:var(--deep2)"></i></div>${new Date(k+'-01').toLocaleDateString('en-GB',{month:'short'})}</div>`}).join('')}
function loyaltyPoints(cid){const L=S.loyalty;if(!L||!L.on||!cid)return 0;
 const spent=S.shopTx.filter(t=>t.custId===cid&&t.type==='income'&&(t.status||'paid')==='paid').reduce((a,t)=>a+t.amt,0);
 const cu=S.customers.find(c=>c.id===cid);return Math.max(0,Math.floor(spent/L.earnPer)-((cu&&cu.redeemed)||0))}
function invRedeem(){const inv=S.inv,L=S.loyalty;if(!inv.custId)return toast('Choose a customer first');
 if((inv.charges||[]).some(c=>c.loyalty))return toast('Points are already applied to this bill');
 const pts=loyaltyPoints(inv.custId);if(pts<L.minRedeem)return toast('Needs at least '+L.minRedeem+' points to redeem');
 const val=Math.round(pts*L.pointValue*100)/100;inv.charges.push({id:Date.now(),name:'Loyalty points ('+pts+')',type:'fixed',value:-val,loyalty:pts,custId:inv.custId});
 toast(pts+' points applied: −'+money(val));render()}
function custStats(id){const rows=S.shopTx.filter(t=>t.custId===id&&t.type==='income');
 const bills=rows.length,outstanding=rows.filter(t=>(t.status||'paid')==='pending').reduce((a,t)=>a+t.amt,0);
 return{bills,outstanding}}

function shopContext(){const c=shopCalc();const prev=shopCalcMonth(lastMonths(2)[1]);const st=prodStats(30);
 const r=n=>Math.round(n*100)/100;
 return JSON.stringify({shop:S.shopProfile.name,currency:S.cur,tax:taxName()+' '+taxRate()+'%',today:isoD(today),
  thisMonth:{sales:r(c.incM),expenses:r(c.expM),profit:r(c.incM-c.expM),expensesByCategory:c.by},
  lastMonth:{sales:r(prev.incM),expenses:r(prev.expM||0)},
  products30days:st.map(x=>({name:x.p.name,price:x.p.price,cost:x.p.cost,stock:x.p.stock,unitsSold:x.units,revenue:r(x.rev),profit:r(x.profit),marginPct:Math.round(x.margin),perDay:r(x.perDay),daysOfStockLeft:x.daysLeft===Infinity?null:Math.round(x.daysLeft),supplierLeadDays:x.lead,suggestedOrderQty:x.suggest,sellThroughPct:Math.round(x.sellThrough)})),
  customers:S.customers.map(cu=>{const cs=custStats(cu.id);return{name:cu.name,bills:cs.bills,outstanding:r(cs.outstanding),loyaltyPoints:loyaltyPoints(cu.id)}}),
  pendingInvoices:S.shopTx.filter(t=>t.type==='income'&&(t.status||'paid')==='pending').map(t=>({date:t.date,desc:t.desc,amount:t.amt}))})}
function localAnswer(q){q=q.toLowerCase();const st=prodStats(30);const L=[];
 if(/best|top|sold most|bestsell/.test(q)){const t=[...st].sort((a,b)=>b.rev-a.rev).slice(0,3);L.push('**Best sellers, last 30 days:**',...t.map((x,i)=>`- ${i+1}. ${x.p.name}: ${x.units} sold, ${money(x.rev)} revenue, ${money(x.profit)} profit`))}
 else if(/reorder|restock|order|run out|stock/.test(q)){const t=S.products.filter(needsReorder).map(p=>({p,st:statOf(p)}));L.push(t.length?'**Reorder these:**':'Nothing needs reordering right now.',...t.map(x=>`- ${x.p.name}: ${x.p.stock} left, lasts ${fmtDays(x.st.daysLeft)}. Order about ${reorderQty(x.p)} from ${supName(x.p.supplierId)}.`))}
 else if(/slow|not selling|dead|aren't selling|stuck/.test(q)){const t=st.filter(x=>x.p.stock>0&&x.sellThrough<15);L.push(t.length?'**Slow movers:**':'Everything is selling at a healthy pace.',...t.map(x=>`- ${x.p.name}: ${x.units} sold in 30 days, ${x.p.stock} on the shelf (${money(x.p.stock*x.p.cost)} at cost). Try a bundle or a small discount.`))}
 else if(/profit|margin|last month|compare/.test(q)){const c=shopCalc(),prev=shopCalcMonth(lastMonths(2)[1]);const ch=prev.incM?Math.round((c.incM-prev.incM)/prev.incM*100):null;L.push(`**This month:** sales ${money(c.incM)}, expenses ${money(c.expM)}, profit ${money(c.incM-c.expM)}.`,`**Last month:** sales ${money(prev.incM)}.`+(ch!==null?` Sales are ${ch>=0?'up':'down'} ${Math.abs(ch)}%.`:''))}
 else if(/owe|outstanding|unpaid|pending/.test(q)){const t=S.customers.map(cu=>({cu,o:custStats(cu.id).outstanding})).filter(x=>x.o>0).sort((a,b)=>b.o-a.o);L.push(t.length?'**Customers with unpaid bills:**':'Nobody owes you money right now.',...t.map(x=>`- ${x.cu.name}: ${money(x.o)}`))}
 else if(/week|summar/.test(q)){const wk=S.saleLines.filter(l=>l.d>=isoD(new Date(today.getFullYear(),today.getMonth(),today.getDate()-6)));const rev=wk.reduce((a,l)=>a+l.qty*l.price,0);const top=[...prodStats(7)].sort((a,b)=>b.rev-a.rev)[0];const low=S.products.filter(needsReorder).length;
  L.push(`- Product sales this week: ${money(rev)}${top&&top.rev?`, led by ${top.p.name}`:''}.`,`- ${low} product${low===1?'':'s'} need reordering soon.`,`- ${S.shopTx.filter(t=>t.type==='income'&&(t.status||'paid')==='pending').length} invoices are still unpaid.`)}
 else L.push('I can answer questions about best sellers, reordering, slow movers, profit, unpaid bills and weekly summaries. Try one of the suggestions above.');
 return L.join('\n')}
function mdLite(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n').map(l=>/^\s*[-•]\s+/.test(l)?`<li>${l.replace(/^\s*[-•]\s+/,'')}</li>`:(l.trim()?`<p style="margin:4px 0">${l}</p>`:'')).join('').replace(/(<li>.*?<\/li>)+/g,m=>`<ul style="margin:6px 0;padding-left:20px">${m}</ul>`)}
async function askAI(q){q=(q||'').trim();if(!q||S.aiBusy)return;S.aiChat.push({role:'user',content:q});
 if(!SAMPLE){S.aiChat.push({role:'assistant',content:localAnswer(q),local:true});render();return}
 S.aiBusy=true;S.aiChat.push({role:'assistant',content:'',pending:true});render();
 const idx=S.aiChat.length-1;const out=()=>document.querySelector('#aiMsg'+idx);
 const RULES='You are the AI assistant inside MVSHOP, a small-shop app. Answer the shop owner using ONLY the shop data below. Use '+S.cur+' for money. Be brief: a one-line answer, then up to 5 bullet points starting with "- ", then one suggested next step. Use **bold** for key numbers. If the data cannot answer, say what is missing. Never invent figures.\n\nSHOP DATA (JSON):\n'+shopContext();
 const turns=[{role:'user',content:RULES},{role:'assistant',content:'Understood. I will answer only from this data.'},...S.aiChat.slice(0,-1).filter(m=>!m.pending&&!m.local&&m.content).slice(-8).map(m=>({role:m.role,content:m.content}))];
 try{const {text}=await SAMPLE(turns,{cache:false,onText:({text})=>{const el=out();if(el)el.innerHTML=mdLite(text)}});S.aiChat[idx]={role:'assistant',content:text}}
 catch(e){S.aiChat[idx]=e&&e.code==='not_granted'?{role:'assistant',content:'AI answers are switched off for this page, so here is the built-in answer:\n'+localAnswer(q),local:true}:{role:'assistant',content:(e&&e.text?e.text+'\n\n':'')+'Couldn\'t reach the AI right now. Here is the built-in answer:\n'+localAnswer(q),local:true}}
 finally{S.aiBusy=false;render()}}

const PRIS=['High','Medium','Regular'];
const priOf=x=>PRIS.includes(x.priority)?x.priority:'Regular';
const priRank=x=>PRIS.indexOf(priOf(x));
function priBadge(p){const c={High:['rgba(180,71,90,.15)','var(--rose)'],Medium:['rgba(227,168,87,.22)','var(--sun)'],Regular:['rgba(91,114,120,.15)','var(--ink2)']}[p]||['rgba(91,114,120,.15)','var(--ink2)'];
 return `<span class="badge" style="background:${c[0]};color:${c[1]}">${p==='High'?'▲ ':p==='Medium'?'■ ':'● '}${p}</span>`}
const priSelect=(id,cur)=>`<select id="${id}" aria-label="Priority" style="width:120px">${PRIS.map(p=>`<option ${cur===p?'selected':''}>${p}</option>`).join('')}</select>`;

 :(()=>{const st=custStats(c.id);return `<tr><td><b>${esc(c.name)}</b>${c.card?`<br><small style="color:var(--gold-d)">🎟️ ${esc(c.card)}</small>`:''}</td><td>${priBadge(priOf(c))}</td><td>${telLink(c.phone)}</td><td>${esc(c.email)||'-'}</td><td>${st.bills}</td><td class="${st.outstanding?'neg':''}">${money(st.outstanding)}</td><td>${S.loyalty.on?'⭐ '+loyaltyPoints(c.id):'—'}</td><td><span class="badge" style="background:${c.status==='Active'?'rgba(47,143,107,.15)':'rgba(91,114,120,.15)'};color:${c.status==='Active'?'var(--ok)':'var(--ink2)'}">● ${c.status}</span></td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="S.editCustomer=${c.id};render()">Edit</button> <button class="btn ghost sm" onclick="arm('cu${c.id}',()=>delCustomer(${c.id}))">${S.armed==='cu'+c.id?'Confirm':'Delete'}</button></td></tr>`})();
 }).join('')}</tbody></table>`}
function workerRows(){const list=contactFilter(S.workers,['name','trade','phone','email']);
 if(!list.length)return'<p class="sub" style="padding:10px 0">'+(S.workers.length?'No repair workers match.':'No repair workers yet.')+'</p>';

 :`<tr><td><b>${esc(w.name)}</b></td><td>${priBadge(priOf(w))}</td><td>${esc(w.trade)||'-'}</td><td>${telLink(w.phone)}</td><td>${esc(w.email)||'-'}</td><td>${w.rate?money(w.rate):'-'}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="S.editWorker=${w.id};render()">Edit</button> <button class="btn ghost sm" onclick="arm('wk${w.id}',()=>delWorker(${w.id}))">${S.armed==='wk'+w.id?'Confirm':'Delete'}</button></td></tr>`}).join('')}</tbody></table>`}
function addWorker(){S.workers.unshift({id:Date.now(),name:'New repair worker',trade:'',phone:'',email:'',rate:0,priority:'Regular'});S.editWorker=S.workers[0].id;S.custQ='';S.contactPri='all';if(S.contactType!=='all')S.contactType='worker';render()}
function saveWorker(id){const w=S.workers.find(x=>x.id===id);if(!w)return;const name=$('#wn'+id).value.trim();
 if(!name)return toast('Add a name');
 Object.assign(w,{name,trade:$('#wt'+id).value.trim(),phone:$('#wp'+id).value.trim(),email:$('#we'+id).value.trim(),rate:Math.max(0,+$('#wr'+id).value||0),priority:$('#wpr'+id).value||'Regular'});

function delWorker(id){S.workers=S.workers.filter(w=>w.id!==id);toast('Repair worker removed');render()}
const CONTACT_TYPES=[['all','All contacts'],['customer','👥 Customers'],['supplier','🚚 Suppliers'],['worker','🔧 Repair workers']];

function addCustomer(){S.customers.unshift({id:Date.now(),name:'New customer',phone:'',email:'',status:'Active',priority:'Regular'});S.custQ='';S.contactPri='all';S.editCustomer=S.customers[0].id;render()}
function saveCustomer(id){const c=S.customers.find(x=>x.id===id),name=$('#cn'+id).value.trim(),phone=$('#cp'+id).value.trim(),email=$('#ce'+id).value.trim(),status=$('#cs'+id).value,priority=$('#cpr'+id).value||'Regular';
 const ce=$('#ccard'+id);let card=ce&&typeof ce.value==='string'?ce.value.trim():(c.card||'');if(card){card=normCard(card);if(!CARD_RE.test(card))return toast('Wallet card numbers look like WM-1234-5678')}
 if(!name)return toast('Add a customer name');
 Object.assign(c,{name,phone,email,status,priority,card});S.editCustomer=null;toast('Customer updated');render()}
function delCustomer(id){S.customers=S.customers.filter(c=>c.id!==id);toast('Customer removed');render()}
function prodStats(days){days=days||30;const from=isoD(new Date(today.getFullYear(),today.getMonth(),today.getDate()-days+1));
 const m={};S.products.forEach(p=>m[p.id]={p,units:0,rev:0,profit:0});
 S.saleLines.forEach(l=>{if(l.d<from||!m[l.pid])return;const r=m[l.pid];r.units+=l.qty;r.rev+=l.qty*l.price;r.profit+=l.qty*(l.price-l.cost)});
 return Object.values(m).map(r=>{const perDay=r.units/days;const sup=S.suppliers.find(x=>x.id===r.p.supplierId);const lead=sup?sup.leadDays:3;
  const margin=r.p.price?(r.p.price-r.p.cost)/r.p.price*100:0;
  return{...r,margin,perDay,lead,daysLeft:perDay>0?r.p.stock/perDay:Infinity,
   sellThrough:(r.units+r.p.stock)?r.units/(r.units+r.p.stock)*100:0,
   suggest:perDay>0?Math.max(0,Math.ceil(perDay*(lead+14)-r.p.stock)):0}})}
const statOf=p=>prodStats(30).find(x=>x.p.id===p.id);
function needsReorder(p){const st=statOf(p);return p.stock<=5||(st&&st.perDay>0&&st.daysLeft<=st.lead+7)}
function reorderQty(p){const st=statOf(p);return st&&st.suggest>0?st.suggest:Math.max(20-p.stock,10)}
const fmtDays=d=>d===Infinity?'no recent sales':d<1?'under a day':Math.round(d)+' day'+(Math.round(d)===1?'':'s');
function supName(id){const s=S.suppliers.find(x=>x.id===id);return s?s.name:'No supplier'}
function POCard(){if(!S.poSupplier)return'';const sup=S.suppliers.find(s=>s.id===S.poSupplier);if(!sup)return'';
 const items=S.products.filter(p=>p.supplierId===sup.id&&needsReorder(p));const total=items.reduce((a,p)=>a+reorderQty(p)*p.cost,0);
 return `<div class="card" style="margin-bottom:18px;border:2px solid var(--gold)"><div class="printhead" style="display:none">${esc(S.shopProfile.name||'Your shop')}<small style="display:block;color:var(--ink2);font-weight:400;margin-top:2px">Purchase order · ${sd(isoD(today))}</small></div>
 <div class="flex between noprint"><h3>Purchase order — ${esc(sup.name)}</h3><span class="flex" style="gap:8px"><button class="btn ghost sm" onclick="printDoc()">Print / save as PDF</button><button class="btn ghost sm" onclick="S.poSupplier=null;render()">Close</button></span></div>
 <p class="sub" style="margin:6px 0 14px">To: ${esc(sup.contact||sup.name)}${sup.phone?' · '+esc(sup.phone):''}${sup.email?' · '+esc(sup.email):''} · Usual lead time ${sup.leadDays} day${sup.leadDays===1?'':'s'}</p>
 ${items.length?`<div class="scroll"><table><thead><tr><th>Product</th><th>Current stock</th><th>Suggested qty</th><th>Cost each</th><th>Subtotal</th></tr></thead><tbody>${items.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${reorderQty(p)}</td><td>${money(p.cost)}</td><td>${money(reorderQty(p)*p.cost)}</td></tr>`).join('')}</tbody></table></div><p style="text-align:right;margin-top:10px;font:600 1.3rem var(--head)">Total: ${money(total)}</p>`:'<p class="sub">Nothing low on stock from this supplier right now.</p>'}</div>`}
function ShopInventoryTab(){
 const low=S.products.filter(needsReorder);const bySup={};low.forEach(p=>{const k=p.supplierId||'none';(bySup[k]=bySup[k]||[]).push(p)});

 ${low.length?`<div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:4px">Needs reordering</h3><p class="sub" style="margin:0 0 10px;font-size:13px">Based on how fast each product sold in the last 30 days and how long your supplier takes to deliver.</p>${Object.entries(bySup).map(([k,items])=>{const sid=k==='none'?null:+k;const sup=sid?S.suppliers.find(s=>s.id===sid):null;

 }).join('')}</div>`:''}
 ${ScanReview('inv')}<div class="card"><div class="flex between" style="flex-wrap:wrap;gap:10px"><h3>Products &amp; stock</h3>${scanBtn('invScan','Scan supplier bill to stock','scanItems',"'inv'")}</div><p class="sub" style="margin:6px 0 18px">Track what you sell and what's left. Sell straight from here — it logs the sale and drops the stock count.</p>
 <div class="scroll"><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Sales speed</th><th>Supplier</th><th>Sell</th><th></th></tr></thead><tbody>${S.products.map(p=>{const ed=S.editProduct===p.id;const low1=p.stock<=5;
 const st=statOf(p)||{perDay:0,daysLeft:Infinity};
 return ed?`<tr><td colspan="8"><div class="flex" style="gap:8px;flex-wrap:wrap"><input id="pn${p.id}" aria-label="Name" value="${esc(p.name)}" style="flex:1;min-width:140px"><input id="pk${p.id}" aria-label="SKU" value="${esc(p.sku)}" style="width:100px"><input id="pp${p.id}" aria-label="Price" type="number" min="0" value="${p.price}" style="width:100px"><input id="pc${p.id}" aria-label="Cost" type="number" min="0" value="${p.cost}" style="width:100px"><input id="ps${p.id}" aria-label="Stock" type="number" min="0" value="${p.stock}" style="width:90px"><select id="psu${p.id}" aria-label="Supplier" style="width:170px"><option value="">No supplier</option>${S.suppliers.map(s=>`<option value="${s.id}" ${p.supplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="btn sm" onclick="saveProduct(${p.id})">Save</button><button class="btn ghost sm" onclick="S.editProduct=null;render()">Cancel</button></div>
 <div style="margin-top:10px"><label for="pd${p.id}" style="margin:0 0 6px">Product description</label><textarea id="pd${p.id}" rows="3" placeholder="Shown on your catalogue, invoices and social posts">${esc(p.desc||'')}</textarea>
 <div class="flex" style="gap:8px;margin-top:8px;align-items:center"><button class="btn ghost sm" id="pdbtn${p.id}" onclick="writeDesc(${p.id})">✨ Write with AI</button><small id="pdmsg${p.id}" style="color:var(--ink2)"></small></div></div></td></tr>`
 :`<tr><td><b>${esc(p.name)}</b>${p.desc?`<br><small style="color:var(--ink2);display:block;max-width:34ch">${esc(p.desc)}</small>`:''}</td><td>${esc(p.sku)}</td><td>${money(p.price)}</td><td class="${low1?'neg':''}">${p.stock}${low1?' ⚠':''}</td><td><small>${st.perDay>0?(st.perDay<1?st.perDay.toFixed(1):Math.round(st.perDay))+'/day · '+fmtDays(st.daysLeft)+' left':'no sales in 30 days'}</small></td><td>${esc(supName(p.supplierId))}</td><td><input aria-label="Quantity to sell" id="qty${p.id}" type="number" min="1" value="1" style="width:64px"><button class="btn ghost sm" onclick="sellProduct(${p.id},+$('#qty${p.id}').value)">Sell</button></td><td><button class="btn ghost sm" onclick="S.editProduct=${p.id};render()">Edit</button> <button class="btn ghost sm" onclick="arm('p${p.id}',()=>delProduct(${p.id}))">${S.armed==='p'+p.id?'Confirm':'Delete'}</button></td></tr>`;
 }).join('')}</tbody></table></div>
 ${S.products.some(p=>p.stock<=5)?`<div class="warnbox" style="margin-top:16px">Some products are low on stock (5 or fewer left) — restock before you run out.</div>`:''}
 <div class="flex" style="margin-top:20px;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px"><input id="npn" aria-label="New product name" placeholder="Product name" style="flex:1;min-width:140px"><input id="npk" aria-label="New SKU" placeholder="SKU" style="width:100px"><input id="npp" aria-label="New price" type="number" min="0" placeholder="Price" style="width:100px"><input id="npc" aria-label="New cost" type="number" min="0" placeholder="Cost" style="width:100px"><input id="nps" aria-label="New stock" type="number" min="0" placeholder="Stock" style="width:90px"><select id="npsu" aria-label="New product supplier" style="width:170px"><option value="">No supplier</option>${S.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn" onclick="addProduct()">Add product</button></div></div>
 <div class="card" style="margin-top:18px"><div class="flex between" style="flex-wrap:wrap;gap:12px"><div><h3 style="margin:0">Suppliers</h3><p class="sub" style="margin:4px 0 0">Contacts and lead times for restocking.</p></div><button class="btn sm" onclick="addSupplier()">+ Add supplier</button></div>

function exportGstMira(){
 if(typeof XLSX==='undefined')return toast('Excel export didn\'t load — try again in a moment');

  {Field:'GST RETURN',Value:''},

  {Field:'GST registration status',Value:p.gstReg?'Registered':'Not registered'},

  {Field:'Filing due date',Value:due},
  {},
  {Field:'OUTPUT TAX (sales)',Value:''},
  {Field:'Standard-rated supplies (value excl. GST)',Value:Math.round(outValue*100)/100},
  {Field:'Output GST (8%)',Value:Math.round(outGst*100)/100},
  {},
  {Field:'INPUT TAX (purchases)',Value:''},

  {Field:'Input GST (8%)',Value:Math.round(inGst*100)/100},

 XLSX.utils.book_append_sheet(wb,formSheet,'GST Return');
 const supRows=[...outRows.map(t=>({Date:t.date,Description:t.desc,Type:'Output (sale)','Value excl. GST':Math.round((t.amt-shopGst(t.amt))*100)/100,GST:Math.round(shopGst(t.amt)*100)/100,'Value incl. GST':t.amt})),
  ...inRows.map(t=>({Date:t.date,Description:t.desc,Type:'Input (purchase)','Value excl. GST':Math.round((t.amt-shopGst(t.amt))*100)/100,GST:Math.round(shopGst(t.amt)*100)/100,'Value incl. GST':t.amt}))].sort((a,b)=>a.Date.localeCompare(b.Date));

 toast('GST return downloaded in spreadsheet format')}

/* ============ DAILY TASKS, TO-DO AND REMINDERS ============
   S.tasks = [{id,title,notes,date,time,repeat:'none'|'daily'|'weekly'|'monthly',remind,doneDates:[iso],done,ai,pri:1-4}]
   pri sorts the to-do list into four parts, most important first (1 Must do … 4 Later). Old tasks without it count as 2.
   A task with no date lives only on the to-do list; its "done" holds the day it was ticked.
   A task shows on its date and, if it repeats, on every later matching day; ticking it off only ticks that day.
   Reminders fire while WalletMV is open: a phone or computer notification when allowed, and a message on screen.
   "Plan my day" asks ChatGPT through the walletmv-ai server function; without it, built-in suggestions are used. */
const REPEAT_L={none:'Just this day',daily:'Every day',weekly:'Every week',monthly:'Every month'};
const hmNow=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};
const hmMins=s=>{const m=String(s||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
function taskOn(t,iso){if(!t||!t.date||iso<t.date)return false;
 if(t.repeat==='daily')return true;
 if(t.repeat==='weekly')return new Date(iso+'T00:00').getDay()===new Date(t.date+'T00:00').getDay();
 if(t.repeat==='monthly'){const a=new Date(t.date+'T00:00').getDate(),d=new Date(iso+'T00:00'),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(a,dim)}
 return iso===t.date}
function tasksOn(iso){return (S.tasks||[]).filter(t=>taskOn(t,iso)).sort((a,b)=>tPri(a)-tPri(b)||(a.time||'99').localeCompare(b.time||'99')||a.id-b.id)}
const taskDone=(t,iso)=>(t.doneDates||[]).includes(iso);
const TK_PRI=[null,{n:'Must do',d:'Important and urgent'},{n:'Should do',d:'Important, not urgent'},{n:'Could do',d:'Nice to get done'},{n:'Later',d:'When you have time'}];
const tPri=t=>[1,2,3,4].includes(+(t&&t.pri))?+t.pri:2;
const tkRep=t=>!!(t.repeat&&t.repeat!=='none');
function billsOn(iso){const d=new Date(iso+'T00:00');if(d.getMonth()!==today.getMonth()||d.getFullYear()!==today.getFullYear())return [];const dim=daysInMonth();return S.bills.filter(b=>Math.min(b.due,dim)===d.getDate())}
function notesOn(iso){return (S.calNotes||[]).filter(n=>n.module==='money'&&(n.date===iso||n.deadline===iso))}
function toggleTask(id,iso){const t=(S.tasks||[]).find(x=>x.id===id);if(!t)return;t.doneDates=t.doneDates||[];const i=t.doneDates.indexOf(iso);
 if(i>=0)t.doneDates.splice(i,1);else{t.doneDates.push(iso);if(t.doneDates.length>400)t.doneDates=t.doneDates.slice(-400);toast('Done: '+t.title)}
 S.dueNow=(S.dueNow||[]).filter(x=>x!==id);render()}
function addTask(){const title=(($('#tk-t')||{}).value||'').trim(),time=($('#tk-time')||{}).value||'',repeat=($('#tk-r')||{}).value||'none',day=S.taskDay||isoD(today);
 if(!title)return toast('Write what you need to do');if(title.length>120)return toast('Keep the task under 120 characters');
 const pri=+(($('#tk-p')||{}).value||2)||2;S.tasks=S.tasks||[];S.tasks.push({id:Date.now(),title,date:day,time,repeat,remind:!!time,doneDates:[],pri});
 toast(time?'Task added. You’ll get a reminder at '+time+'.':'Task added');render()}
function delTask(id){S.tasks=(S.tasks||[]).filter(t=>t.id!==id);toast('Task removed');render()}
function pickTaskDay(iso){S.taskDay=iso;S.tkTab='day';S.aiPlan=null;render()}
function taskWeek(base){const d=new Date(base+'T00:00'),start=new Date(d);start.setDate(d.getDate()-d.getDay());return [...Array(7)].map((_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return isoD(x)})}

/* Suggestions: ChatGPT when it's switched on, built-in rules otherwise */
async function aiCall(action,extra){if(!walletAuth||!S.signed)return {ok:false};try{const {data,error}=await walletAuth.functions.invoke('walletmv-ai',{body:{action,...(extra||{})}});if(error||!data)return {ok:false};return data}catch(e){return {ok:false}}}
async function checkAi(){if(S.aiOn!==undefined)return;S.aiOn=null;const r=await aiCall('status');S.aiOn=!!(r&&r.ok&&r.on);if(S.page==='money'&&S.mview==='tasks')render()}
function moneyFigures(iso){const s=safeToSpend(),m=calc(curMk()),dim=daysInMonth(),wd=new Date(iso+'T00:00').toLocaleDateString('en-GB',{weekday:'long'});
 return [`Day to plan: ${wd} ${ld(iso)}. Today is ${ld(isoD(today))}.`,
  `Monthly budget: ${s.limit?money(s.limit):'not set'}. Spent this month: ${money(m.exp)}. Income this month: ${money(m.inc)}. Safe to spend per day: ${s.limit?money(Math.floor(s.per)):'unknown'}.`,
  `Bills this month: ${S.bills.length?S.bills.map(b=>`${b.name} ${money(b.amt)} due on day ${Math.min(b.due,dim)}${b.paidThisMonth?' (paid)':''}`).join('; '):'none'}.`,
  `Savings goals: ${S.goals.length?S.goals.map(g=>`${g.name}: ${money(g.saved)} of ${money(g.target)}`).join('; '):'none'}.`,
  `Top spending this month: ${Object.entries(m.by).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,v])=>c+' '+money(v)).join('; ')||'nothing yet'}.`,
  `Grocery items still to buy: ${((S.groc&&S.groc.list)||[]).filter(i=>!i.done).length}.`,
  `Tasks already planned that day: ${tasksOn(iso).map(t=>t.title).join('; ')||'none'}.`].join('\n').slice(0,6000)}
function localPlan(iso){const out=[],have=tasksOn(iso).map(t=>t.title.toLowerCase()),s=safeToSpend(),d=new Date(iso+'T00:00'),dim=daysInMonth(),sameMonth=d.getMonth()===today.getMonth();
 if(sameMonth)S.bills.filter(b=>!b.paidThisMonth).map(b=>({b,day:Math.min(b.due,dim)})).filter(x=>x.day-d.getDate()<=3).sort((a,b)=>a.day-b.day)
  .forEach(({b,day})=>out.push({title:`Pay ${b.name} (${money(b.amt)})`,why:day<d.getDate()?'This bill is overdue.':day===d.getDate()?'It’s due this day.':`It’s due on the ${day}.`}));
 if(s.limit>0)out.push({title:`Keep spending under ${money(Math.floor(s.per))}`,why:'That keeps you inside this month’s budget.'});
 const g=S.goals.filter(x=>x.saved<x.target).sort((a,b)=>a.saved/a.target-b.saved/b.target)[0];
 if(g){const amt=Math.max(50,Math.round(Math.min(g.target-g.saved,g.target*0.05)/50)*50);out.push({title:`Add ${money(amt)} to ${g.name}`,why:`You’ve saved ${Math.round(g.saved/g.target*100)}% so far.`})}
 if(iso===isoD(today)&&!S.tx.some(t=>t.date===iso))out.push({title:'Log what you spend today',why:'A quick entry keeps your safe-to-spend number right.'});
 const gl=((S.groc&&S.groc.list)||[]).filter(i=>!i.done).length;if(gl)out.push({title:`Buy groceries (${gl} item${gl===1?'':'s'} on your list)`,why:'Your list is ready in Groceries.'});
 if(!s.limit)out.push({title:'Set a monthly budget',why:'Then WalletMV can show what’s safe to spend each day.'});
 return out.filter(x=>!have.includes(x.title.toLowerCase())).slice(0,5)}
async function planDay(btn){const iso=S.taskDay||isoD(today);if(btn){btn.disabled=true;btn.textContent='Planning…'}
 const useAi=S.aiOn&&!onFree(),r=useAi?await aiCall('plan_day',{figures:moneyFigures(iso)}):null;
 if(r&&r.ok&&Array.isArray(r.tasks)&&r.tasks.length)S.aiPlan={iso,src:'ai',items:r.tasks.slice(0,5)};
 else S.aiPlan={iso,src:'local',items:localPlan(iso),fellBack:!!useAi};
 render()}
function addPlanItem(i){const p=S.aiPlan;if(!p||!p.items[i])return;const it=p.items[i];S.tasks=S.tasks||[];
 S.tasks.push({id:Date.now()+i,title:String(it.title).slice(0,120),date:p.iso,time:'',repeat:'none',remind:false,doneDates:[],ai:p.src==='ai',pri:/^pay /i.test(it.title)?1:2});p.items.splice(i,1);toast('Added to your tasks');render()}
function addAllPlan(){const p=S.aiPlan;if(!p||!p.items.length)return;S.tasks=S.tasks||[];const n=p.items.length;
 p.items.forEach((it,i)=>S.tasks.push({id:Date.now()+i,title:String(it.title).slice(0,120),date:p.iso,time:'',repeat:'none',remind:false,doneDates:[],ai:p.src==='ai',pri:/^pay /i.test(it.title)?1:2}));S.aiPlan=null;toast(n+' task'+(n===1?'':'s')+' added');render()}
async function askMoney(btn){const q=(($('#ask-q')||{}).value||'').trim();if(!q)return toast('Type a question first');if(q.length>300)return toast('Keep the question under 300 characters');
 btn.disabled=true;btn.textContent='Thinking…';const r=await aiCall('ask',{question:q,figures:moneyFigures(isoD(today))});
 S.aiAnswer={q,a:r&&r.ok&&r.answer?r.answer:'We couldn’t reach the AI just now. Please try again in a minute.',ok:!!(r&&r.ok)};render()}

/* Reminders */
function remindersTick(){if(!S.signed||!S.dataReady||!(S.tasks||[]).length)return;const now=new Date(),iso=isoD(now),nowM=now.getHours()*60+now.getMinutes();
 let sent=[];try{sent=JSON.parse(localStorage.getItem('walletmv:reminded:'+iso)||'[]')}catch(e){}
 const due=tasksOn(iso).filter(t=>{const m=hmMins(t.time);return m!==null&&t.remind!==false&&!taskDone(t,iso)&&m<=nowM&&nowM-m<=180&&!sent.includes(t.id)});
 if(!due.length)return;
 due.forEach(t=>{sent.push(t.id);try{if(!STORE_APP&&'Notification' in window&&Notification.permission==='granted'){const n=new Notification('WalletMV reminder',{body:t.title+' · '+t.time,icon:'/icons/icon-192.png',tag:'wmv-task-'+t.id});n.onclick=()=>{try{window.focus()}catch(e){}S.page='money';S.mview='tasks';S.taskDay=iso;S.tkTab='day';render()}}}catch(e){}});
 try{localStorage.setItem('walletmv:reminded:'+iso,JSON.stringify(sent))}catch(e){}
 S.dueNow=[...new Set([...(S.dueNow||[]),...due.map(t=>t.id)])];toast('⏰ '+(due.length===1?due[0].title:due.length+' tasks are due now'));if(S.page==='money')render()}
setInterval(remindersTick,30000);setTimeout(remindersTick,5000);

/* ---------- Saving each person's data to their own account ----------
   Personal and shop records are saved to Supabase (table walletmv_app_state: one row per account, each person can only
   read and write their own row) and kept on this device too, so the app opens fast and copes with a weak connection.
   The sample data people see before logging in (the public MVSHOP demo) is never saved to anyone's account. */
if(!Array.isArray(S.tasks))S.tasks=[];
if(!Array.isArray(S.docs))S.docs=[];
const SAVE_KEYS=['subscription','pendingSubs','tasks','docs','catBudgets','tx','accounts','transfers','goals','bills','budget','calNotes','groc','quick','cats','homeStock','cur','theme','notif','walletCard','shared','discounts','shopProfile','products','saleLines','shopTx','customers','suppliers','workers','loyalty','docCounters','chargePresets','defaultGst','inv'];
const DEMO_DATA=JSON.parse(JSON.stringify(Object.fromEntries(SAVE_KEYS.map(k=>[k,S[k]]))));
var _dataUid=null,_saveT=null,_lastSaved='',_retryT=null;
const LOCAL_KEY=uid=>'walletmv:data:'+uid;
function myData(){const d={};SAVE_KEYS.forEach(k=>d[k]=S[k]);return d}
function applyData(d){const base=blankData();SAVE_KEYS.forEach(k=>{S[k]=d&&Object.prototype.hasOwnProperty.call(d,k)?d[k]:base[k]});try{document.documentElement.setAttribute('data-theme',S.theme||'light')}catch(e){}}
function newCardNo(){const r=()=>String(Math.floor(1000+Math.random()*9000));return 'WM-'+r()+'-'+r()}
function blankData(){const d=JSON.parse(JSON.stringify(DEMO_DATA)),t=isoD(new Date());
 Object.assign(d,{subscription:{plan:'',status:'none',requestedAt:null,approvedAt:null},pendingSubs:[],tasks:[],docs:[],catBudgets:{},tx:[],transfers:[],goals:[],bills:[],calNotes:[],homeStock:[],discounts:[],products:[],saleLines:[],shopTx:[],customers:[],suppliers:[],workers:[],chargePresets:[],
  shared:[{id:1,name:S.name||'You',contact:S.email||'',role:'owner',status:'joined',since:t}],walletCard:{number:newCardNo(),since:t},
  accounts:(DEMO_DATA.accounts||[]).map(a=>({...a,start:0})),budget:{income:0,limit:0},theme:'light',
  shopProfile:{...(DEMO_DATA.shopProfile||{}),name:'',tin:''},docCounters:{invoice:1001,quotation:2001,receipt:5001}});
 if(d.groc&&typeof d.groc==='object')d.groc={...d.groc,list:[]};
 return d}
function readLocal(uid){try{return JSON.parse(localStorage.getItem(LOCAL_KEY(uid))||'null')}catch(e){return null}}
async function loadMyData(user){if(!walletAuth||!user||_dataUid===user.id)return;_dataUid=user.id;S.joinedAt=/^\d{4}-\d{2}-\d{2}/.test(String(user.created_at||''))?String(user.created_at).slice(0,10):isoD(today);S.dataReady=false;_lastSaved='';
 const local=readLocal(user.id);if(local&&local.d){applyData(local.d);render()}
 let res;try{res=await walletAuth.from('walletmv_app_state').select('state,updated_at').eq('user_id',user.id).maybeSingle()}catch(e){res={error:e}}
 if(_dataUid!==user.id)return;
 const row=res&&res.data,cloud=row&&row.state&&row.state.d;
 if(res&&res.error){if(!local)applyData(blankData());S.syncErr=true}
 else if(cloud&&(!local||!local.at||new Date(row.updated_at)>=new Date(local.at))){applyData(cloud);_lastSaved=JSON.stringify(myData());S.syncErr=false}
 else if(!local&&!cloud){applyData(blankData())}
 S.dataReady=true;render();loadMyPayments(true)}
function queueSave(){if(!S.signed||!_dataUid||!S.dataReady||!walletAuth)return;const j=JSON.stringify(myData());if(j===_lastSaved)return;clearTimeout(_saveT);_saveT=setTimeout(()=>saveNow(j),1200)}
async function saveNow(j){if(!_dataUid||!walletAuth||!S.dataReady)return;j=j||JSON.stringify(myData());if(j===_lastSaved)return;
 const uid=_dataUid,at=new Date().toISOString(),d=JSON.parse(j);
 try{localStorage.setItem(LOCAL_KEY(uid),JSON.stringify({at,d}))}catch(e){}
 let error=null;try{({error}=await walletAuth.from('walletmv_app_state').upsert({user_id:uid,state:{v:1,d},updated_at:at},{onConflict:'user_id'}))}catch(e){error=e}
 if(error){S.syncErr=true;clearTimeout(_retryT);_retryT=setTimeout(()=>saveNow(),15000)}else{if(uid===_dataUid)_lastSaved=j;S.syncErr=false}}
function clearMyData(keepLocal){const uid=_dataUid;clearTimeout(_saveT);clearTimeout(_retryT);_dataUid=null;_lastSaved='';S.dataReady=false;S.syncErr=false;
 if(uid&&!keepLocal){try{localStorage.removeItem(LOCAL_KEY(uid))}catch(e){}}applyData(DEMO_DATA)}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(_saveT);saveNow()}});
addEventListener('pagehide',()=>{clearTimeout(_saveT);saveNow()});
function syncNote(){if(!S.signed)return'';return S.syncErr?`<p class="sub" style="margin:10px 0 0;font-size:13px;color:var(--rose)">Not saved to your account yet. Check your internet; we’ll keep trying.</p>`:(S.dataReady?`<p class="sub" style="margin:10px 0 0;font-size:13px;color:var(--ok)">✓ Saved to your account</p>`:'')}

 btn.disabled=true;const {error}=await walletAuth.auth.updateUser({password:v});btn.disabled=false;if(error)return toast(auNice(error,'We couldn’t change your password'));$('#pw2').value='';toast('Password changed')}

 if(!window.confirm('Delete your WalletMV account?\n\nThis permanently deletes your transactions, accounts, budgets, goals, bills, grocery lists, saved documents and photos, shop records and settings, and closes your login. It can’t be undone.'))return;
 btn.disabled=true;const label=btn.textContent;btn.textContent='Deleting…';
 let res;try{res=await walletAuth.functions.invoke('walletmv-delete-account',{body:{confirm:true}})}catch(e){res={error:e}}

 if(res.error||!data||!data.ok){btn.disabled=false;btn.textContent=label;return toast('We couldn’t delete your account right now. Please try again, or message us on WhatsApp.')}
 clearMyData();try{await walletAuth.auth.signOut()}catch(e){}
 S.signed=false;S.comp=null;S.isOwner=false;S.freeList=null;S.name='';S.email='';S.auth='login';S.page=STORE_APP?'money':'home';render();scrollTo(0,0);

const auGoogle=label=>(_googleOn&&!STORE_APP)?`<button type="button" class="au-btn ghost" onclick="googleSignIn(this)">${G_ICON}<span>${label}</span></button><div class="au-or"><span>or use your email</span></div>`:'';

/* ---------- Log in, sign up and password help ----------
   Screens: S.auth = 'login' | 'signup' | 'forgot' | 'resend' | 'sent'; S.recovery shows "Set a new password".
   Supabase lets each email address get one auth email every 60 seconds, so "Resend" waits that long. */
const AUTH_GAP=60;let _auTick=null;
const auEmailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e||'');
function auVal(id){const el=$('#'+id);return el?el.value.trim():''}
function auSay(m,kind){const el=$('#au-msg');if(!el)return m&&toast(m);el.className='au-msg '+(kind||'err');el.textContent=m||''}
function auBusy(btn,on,label){if(!btn)return;if(on){btn.dataset.l=btn.textContent;btn.disabled=true;btn.textContent=label||'Please wait…'}else{btn.disabled=false;if(btn.dataset.l)btn.textContent=btn.dataset.l}}
function auLeft(){return Math.max(0,Math.ceil(((S.auUntil||0)-Date.now())/1000))}
function auHold(secs){S.auUntil=Date.now()+secs*1000}
function auClock(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function auWaitSecs(err){const m=String(err&&err.message||'');const n=m.match(/after (\d+) second/i);if(n)return +n[1];if(err&&(err.status===429||/rate limit|too many/i.test(m)))return AUTH_GAP;return 0}
function auNice(err,fallback){const m=String(err&&err.message||''),code=String(err&&err.code||'');
 if(/email rate limit exceeded/i.test(m)||code==='over_email_send_rate_limit'&&!/after \d+ second/i.test(m))return 'We’ve sent a lot of emails in the last hour. Please try again a little later, or message us on WhatsApp.';
 const w=auWaitSecs(err);if(w)return `For your safety, you can ask for another email in ${w} seconds.`;
 if(/invalid login credentials/i.test(m)||code==='invalid_credentials')return 'That email and password don’t match. Try again, or reset your password.';
 if(/email not confirmed/i.test(m)||code==='email_not_confirmed')return 'Please confirm your email first. Open the link we sent you, or tap “Confirm email” below.';
 if(/already registered|already exists/i.test(m)||code==='user_already_exists')return 'This email already has an account. Log in, or reset your password.';
 if(/different from the old|same_password/i.test(m)||code==='same_password')return 'Choose a password you haven’t used before on WalletMV.';
 if(/weak|password should/i.test(m)||code==='weak_password')return 'Choose a stronger password: at least 8 characters, with a number.';
 if(/session|jwt|expired/i.test(m))return 'This reset link has expired. Ask for a new one from “Forgot password?”.';
 if(/fetch|network|load failed/i.test(m))return 'We couldn’t reach WalletMV. Check your internet and try again.';
 return m||fallback||'Something went wrong. Please try again.'}
function authGo(v){S.auth=v;render();scrollTo(0,0);setTimeout(()=>{const f=document.querySelector('.au-card input:not([type=checkbox])');if(f&&matchMedia('(min-width:861px)').matches)f.focus()},0)}
function auPeek(id,btn){const i=$('#'+id);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';btn.setAttribute('aria-pressed',String(show));btn.textContent=show?'Hide':'Show';btn.setAttribute('aria-label',(show?'Hide':'Show')+' password')}
function auStrength(v){if(!v)return 0;if(v.length<8)return 1;let s=0;if(v.length>=12)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;return s>=3?4:s===2?3:2}
function auMeter(inp){const m=$('#au-meter');if(!m)return;const s=auStrength(inp.value);const L=['At least 8 characters','Too short','Okay','Good','Strong'],C=['transparent','#B4434E','#C9913D','#1F7A5C','#1F7A5C'];const bar=m.querySelector('i');bar.style.width=(s*25)+'%';bar.style.background=C[s];m.querySelector('span').textContent=L[s]}
function auInbox(em){const d=(String(em).split('@')[1]||'').toLowerCase();if(d==='gmail.com'||d==='googlemail.com')return['Open Gmail','https://mail.google.com/'];if(/^(outlook|hotmail|live|msn)\./.test(d))return['Open Outlook','https://outlook.live.com/mail/'];if(/^(yahoo|ymail)\./.test(d))return['Open Yahoo Mail','https://mail.yahoo.com/'];return null}
function auTick(){clearInterval(_auTick);const upd=()=>{const b=$('#au-resend'),c=$('#au-count');if(!b){clearInterval(_auTick);return}const l=auLeft();b.disabled=l>0;if(c)c.textContent=l>0?'You can send it again in '+auClock(l):'Didn’t get it? You can send it again now.';if(!l)clearInterval(_auTick)};upd();_auTick=setInterval(upd,1000)}
function auSignedIn(user,em,msg){S.email=user.email||em;S.name=user.user_metadata?.full_name||S.email.split('@')[0];S.signed=true;S.allAccess=false;S.recovery=false;S.auth='login';S.page='money';S.mview='today';toast(msg);render()}

async function attemptLogin(btn){const em=auVal('em'),pw=($('#pw')||{}).value||'';S.email=em;
 if(!walletAuth)return auSay('Sign-in couldn’t load. Check your internet, then refresh the page.');
 if(!auEmailOk(em))return auSay('Enter the email address you signed up with.');
 if(!pw)return auSay('Enter your password.');
 auSay('');auBusy(btn,true,'Logging in…');
 const {data,error}=await walletAuth.auth.signInWithPassword({email:em,password:pw});auBusy(btn,false);
 if(error)return auSay(auNice(error,'We couldn’t log you in.'));
 auSignedIn(data.user,em,'Welcome back')}

async function createAccount(btn){const nm=auVal('su-name'),ph=auVal('su-phone').replace(/\s+/g,''),em=auVal('em'),pw=($('#pw')||{}).value||'',ok=($('#su-terms')||{}).checked;
 S.email=em;S.suName=nm;S.suPhone=ph;
 if(!walletAuth)return auSay('Sign-up couldn’t load. Check your internet, then refresh the page.');
 if(!nm)return auSay('Enter your name.');
 if(!auEmailOk(em))return auSay('Enter a valid email address.');
 if(ph&&!/^\+?\d{7,15}$/.test(ph))return auSay('Enter your phone number using digits only, like 7771234.');
 if(pw.length<8)return auSay('Choose a password with at least 8 characters.');
 if(!ok)return auSay('Please agree to the Terms and Privacy Policy.');
 if(auLeft()>0)return auSay(`For your safety, you can ask for another email in ${auLeft()} seconds.`);
 auSay('');auBusy(btn,true,'Creating your account…');
 const phone=ph?(ph.startsWith('+')?ph:'+960'+ph):'';
 const {data,error}=await walletAuth.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin,data:{full_name:nm,phone}}});auBusy(btn,false);
 if(error){const w=auWaitSecs(error);if(w)auHold(w);return auSay(auNice(error,'We couldn’t create your account.'))}
 if(data?.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return auSay('This email already has an account. Log in, or reset your password.');
 if(data?.session&&data.user)return auSignedIn(data.user,em,'Account created. Welcome to WalletMV');
 auHold(AUTH_GAP);S.auSent='confirm';authGo('sent')}

async function auSendEmail(btn,kind){const again=S.auth==='sent';const em=again?S.email:auVal('em');S.email=em;
 if(!walletAuth)return auSay('Email sending couldn’t load. Check your internet, then refresh the page.');
 if(!auEmailOk(em))return auSay('Enter the email address you use for WalletMV.');
 if(auLeft()>0)return auSay(`For your safety, you can ask for another email in ${auLeft()} seconds.`);
 auSay('');auBusy(btn,true,'Sending…');
 const {error}=kind==='reset'?await walletAuth.auth.resetPasswordForEmail(em,{redirectTo:location.origin}):await walletAuth.auth.resend({type:'signup',email:em,options:{emailRedirectTo:location.origin}});
 auBusy(btn,false);
 if(error){const w=auWaitSecs(error);if(w){auHold(w);if(again)auTick()}return auSay(auNice(error,'We couldn’t send the email. Please try again.'))}
 auHold(AUTH_GAP);S.auSent=kind;S.auFlash=again?{m:'A new email is on its way. Use the newest one.',k:'ok'}:null;authGo('sent')}
function sendPasswordReset(btn){return auSendEmail(btn,'reset')}
function resendConfirmation(btn){return auSendEmail(btn,'confirm')}
function auResend(btn){return auSendEmail(btn,S.auSent==='reset'?'reset':'confirm')}

async function saveNewPassword(btn){const a=($('#npw')||{}).value||'',b=($('#npw2')||{}).value||'';
 if(!walletAuth)return auSay('Sign-in couldn’t load. Check your internet, then refresh the page.');
 if(a.length<8)return auSay('Use at least 8 characters.');if(a!==b)return auSay('The two passwords don’t match.');
 auSay('');auBusy(btn,true,'Saving…');
 const {data,error}=await walletAuth.auth.updateUser({password:a});auBusy(btn,false);
 if(error)return auSay(auNice(error,'We couldn’t save your new password.'));
 auSignedIn(data?.user||{email:S.email},S.email,'Password changed. You’re logged in.')}

function calcRange(from,to){const c=S.tx.filter(t=>t.date>=from&&t.date<=to);const inc=c.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);const by={};c.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);const exp=Object.values(by).reduce((a,b)=>a+b,0);return{inc,exp,by}}

function shopCalcRange(from,to){const cM=S.shopTx.filter(t=>t.date>=from&&t.date<=to);
 const incM=cM.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);
 const expM=cM.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amt,0);
 const outGst=cM.filter(t=>t.type==='income'&&t.gst).reduce((a,t)=>a+shopGst(t.amt),0);
 const by={};cM.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 return{incM,expM,outGst,by}}
function setShopRepMode(mode){S.shopRepMode=mode;if(mode==='range'&&!S.shopRepFrom){const d=new Date();S.shopRepFrom=isoD(new Date(d.getFullYear(),d.getMonth(),1));S.shopRepTo=isoD(today)}render()}
function donut(by){const tot=Object.values(by).reduce((a,b)=>a+b,0);if(!tot)return'<p class="sub">No spending yet. Add an expense to see the breakdown.</p>';let a=0;const st=Object.entries(by).map(([k,v])=>{const s=a;a+=v/tot*100;return `${CATC[k]||'#9AAAB0'} ${s}% ${a}%`}).join(',');
 return `<div class="flex" style="gap:24px"><div class="donut" role="img" aria-label="Spending by category" style="background:conic-gradient(${st})"></div><div class="legend">${Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<span><b style="font-weight:400"><i style="background:${CATC[k]||'#9AAAB0'}"></i>${k}</b><span style="color:var(--ink2)">${Math.round(v/tot*100)}%</span></span>`).join('')}</div></div>`}

const discText=d=>d.custom?d.custom:(d.type==='percent'?d.value+'% off':money(d.value)+' off');

 if(!d.expires)return 'No expiry';const n=Math.round((new Date(d.expires+'T00:00')-new Date(isoD(today)+'T00:00'))/864e5);return n===0?'Expires today':'Expires in '+n+' day'+(n===1?'':'s')+' ('+sd(d.expires)+')'};

 if(cid){const cu=S.customers.find(c=>c.id===+cid);if(cu&&cu.card)card=cu.card}
 if(!CARD_RE.test(card))return toast('Enter a valid card number, like WM-1234-5678');
 const type=$('#dcType').value,value=+$('#dcVal').value,minSpend=+$('#dcMin').value||0,days=+$('#dcDays').value||14,note=$('#dcNote').value.trim();
 if(!(value>0))return toast('Set a discount above zero');
 if(type==='percent'&&value>90)return toast('Percentage discounts can be up to 90%');
 const expires=isoD(new Date(today.getFullYear(),today.getMonth(),today.getDate()+days));
 S.discounts.unshift({id:Date.now(),card,shop:S.shopProfile.name,type,value,minSpend,expires,note,status:'active',issued:isoD(today)});
 const cu=custByCard(card);toast(discText(S.discounts[0])+' sent to '+(cu?cu.name+'\'s':'card '+card)+' wallet');render()}

function discAmount(d,sub){return d.type==='percent'?sub*d.value/100:d.value}

 S.inv.custId=cu.id;S.inv.cust=cu.name;toast('Found '+cu.name);render()}

 toast(discText(d)+' applied');render()}

function scanBill(file){
 if(!file)return;
 const st=$('#scanStatus');
 if(st)st.innerHTML='<small style="color:var(--ink2)">Reading the image…</small>';
 if(typeof Tesseract==='undefined'){if(st)st.innerHTML='<small class="err" style="margin:0">Scanning didn\'t load — enter the bill by hand.</small>';return}
 Tesseract.recognize(file,'eng').then(({data:{text}})=>{
  const nums=[...text.matchAll(/\d[\d,]*\.\d{2}|\d{3,}/g)].map(m=>parseFloat(m[0].replace(/,/g,''))).filter(n=>n>0&&n<1000000);
  const amt=nums.length?Math.max(...nums):null;
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>2&&/[a-zA-Z]/.test(l)&&!/total|amount|due|invoice|bill|receipt/i.test(l));
  const name=(lines[0]||'Scanned bill').slice(0,40);
  const dm=text.match(/\b([0-3]?\d)[\/\-.]([01]?\d)(?:[\/\-.]\d{2,4})?\b/);
  const due=dm?Math.min(31,Math.max(1,parseInt(dm[1],10))):today.getDate();
  if($('#bn'))$('#bn').value=name;
  if($('#ba')&&amt)$('#ba').value=amt;
  if($('#bd'))$('#bd').value=due;
  if(st)st.innerHTML='<small style="color:var(--ok)">Read the image — check the details below, then Add bill.</small>';
 }).catch(()=>{if(st)st.innerHTML='<small class="err" style="margin:0">Could not read that image — enter the bill by hand.</small>'});
}

function trendSVG(){const ks=lastMonths(6).reverse(),d=ks.map(k=>calc(k)),mx=Math.max(1,...d.map(x=>Math.max(x.inc,x.exp)))*1.1;
 const W=520,H=200,L=44,B=26,T=10,xs=k=>L+k*(W-L-14)/(ks.length-1),ys=v=>T+(H-T-B)*(1-v/mx);
 const line=(f,c)=>{const pts=d.map((x,k)=>[xs(k),ys(f(x))]);return `<path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L')} L${xs(ks.length-1)} ${H-B} L${L} ${H-B}Z" fill="${c}" fill-opacity=".08"/><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('')}`};
 const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-6}" y1="${ys(mx/1.1*f)}" y2="${ys(mx/1.1*f)}" stroke="var(--line)"/><text x="${L-8}" y="${ys(mx/1.1*f)+4}" text-anchor="end" font-size="11" fill="var(--ink2)">${Math.round(mx/1.1*f/1000)}k</text>`).join('');
 const lab=ks.map((k,n)=>`<text x="${xs(n)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--ink2)">${new Date(k+'-01T00:00').toLocaleDateString('en-GB',{month:'short'})}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Income and expenses, last 6 months">${grid}${line(x=>x.inc,'#1F7A5C')}${line(x=>x.exp,'#B4434E')}${lab}</svg>`}

const nlHead=(t,sub,act)=>`<div class="nl-head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div>${act?`<div class="act">${act}</div>`:''}</div>`;

function balanceHistory(days){const total=S.accounts.reduce((a,x)=>a+accountBalance(x.id),0);const out=[];
 for(let i=days-1;i>=0;i--){const d=dAgo(i);const after=S.tx.filter(t=>t.date>d).reduce((a,t)=>a+(t.type==='income'?t.amt:-t.amt),0);out.push({d,v:total-after})}return out}
function nlLine(pts){if(pts.length<2)return '';const vals=pts.map(p=>p.v),mn=Math.min(...vals),mx=Math.max(...vals),span=(mx-mn)||1,W=540,H=170,top=14,bot=150;
 const xy=pts.map((p,i)=>[(i/(pts.length-1))*W,(bot-(p.v-mn)/span*(bot-top))]);const line=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const last=xy[xy.length-1];
 return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Total balance over the last ${pts.length} days, from ${money(vals[0])} to ${money(vals[vals.length-1])}"><line x1="0" y1="${bot}" x2="${W}" y2="${bot}" stroke="var(--line)"></line><line x1="0" y1="${(top+bot)/2}" x2="${W}" y2="${(top+bot)/2}" stroke="var(--line)" stroke-dasharray="4 4"></line><path d="${line} L${W} ${bot} L0 ${bot} Z" fill="rgba(201,169,97,.16)"></path><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.5" vector-effect="non-scaling-stroke"></path><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--gold-d)"></circle></svg><div class="nl-axis"><span>${sd(pts[0].d)}</span><span>Today</span></div>`}
function Accounts(){const ed=S.editAccount,accs=S.accounts,total=accs.reduce((a,x)=>a+accountBalance(x.id),0);
 const hist=balanceHistory(30),chg=hist.length?hist[hist.length-1].v-hist[0].v:0;const open=S.addAccOpen||!accs.length;
 const txN=id=>S.tx.filter(t=>t.accId===id&&mk(t.date)===curMk()).length;
 return `${nlHead('Accounts',`${accs.length} account${accs.length===1?'':'s'} · ${money(total)} in total`,nlBtn(open?'Close':'Add account',`S.addAccOpen=${!open};render()`,open?'x':'plus','primary'))}

 <div class="nl-accs">${accs.map((a,i)=>ed===a.id?`<div class="nl-acc"><div class="nl-field"><label for="an${a.id}">Name</label><input id="an${a.id}" value="${esc(a.name)}"></div><div class="nl-field"><label for="at${a.id}">Type</label><select id="at${a.id}">${['bank','cash','ewallet'].map(t=>`<option value="${t}" ${a.type===t?'selected':''}>${ACC_T[t]}</option>`).join('')}</select></div><div class="nl-row-btns">${nlBtn('Save',`saveAccount(${a.id})`,null,'primary sm')}${nlBtn('Cancel','S.editAccount=null;render()',null,'sm')}</div></div>`
  :`<div class="nl-acc${i===0?' hl':''}"><div class="at"><b>${esc(a.name)}</b><span class="ty">${ACC_T[a.type]||'Account'}</span></div><span class="num">${money(accountBalance(a.id))}</span><div class="ft"><span>${txN(a.id)} transaction${txN(a.id)===1?'':'s'} this month</span><span class="nl-row-btns"><button class="nl-link sm" onclick="S.editAccount=${a.id};render()">Edit</button><button class="nl-link sm bad" onclick="arm('acc${a.id}',()=>delAccount(${a.id}))">${S.armed==='acc'+a.id?'Tap again to delete':'Delete'}</button></span></div></div>`).join('')}</div>
 <div class="nl-row2">

function Tx(){const names=[...new Set(S.cats.filter(c=>c.t==='expense').map(c=>c.n))],m=calc(curMk()),net=m.inc-m.exp;

 return `${nlHead('Transactions',`${mLabel(curMk())} · income ${signed(m.inc,true)} · spent ${signed(m.exp,false)} · net ${signed(net,net>=0)}`,nlBtn('Export to Excel','exportMoneyXLS()','down'))}

function Budget(){const m=calc(curMk()),lim=S.budget.limit,used=pct(m.exp,lim),left=Math.max(0,lim-m.exp),dl=daysLeft();
 const rows=catBudgetRows(),over=rows.filter(r=>r.limit>0&&r.spent>r.limit).length,edit=S.budEdit||!(lim>0);
 const names=[...new Set(S.cats.filter(c=>c.t==='expense').map(c=>c.n))].filter(n=>!((S.catBudgets||{})[n]>0));
 return `${nlHead('Budgets',`${mLabel(curMk())} · ${dl} day${dl===1?'':'s'} left in the month`,nlBtn(edit?'Close':'Edit monthly budget',`S.budEdit=${!edit};render()`,edit?'x':'sliders'))}
 ${edit?`<section class="nl-card nl-form"><h2>Monthly budget</h2><div class="nl-2"><div class="nl-field"><label for="b1">Income each month (${esc(S.cur)})</label><input id="b1" type="number" min="0" value="${S.budget.income}"></div><div class="nl-field"><label for="b2">Spending limit (${esc(S.cur)})</label><input id="b2" type="number" min="0" value="${S.budget.limit}"></div></div><div id="berr"></div><div>${nlBtn('Save budget','saveBudgetNow()',null,'primary')}</div></section>`:''}

  <div class="nl-kv"><span>Left to spend</span><b>${lim>0?money(left):'—'}</b></div><div class="nl-kv"><span>Per day</span><b>${lim>0?money(left/dl):'—'}</b></div><div class="nl-kv"><span>Over budget</span><b class="${over?'bad':''}">${over} categor${over===1?'y':'ies'}</b></div></section>

function setRepPeriod(p){if((p==='3m'||p==='custom')&&onFree())return freeStop('Reports for more than one month');const ms=lastMonths(2);if(p==='this'){S.repMode='month';S.repMonth=ms[0]}else if(p==='last'){S.repMode='month';S.repMonth=ms[1]}else if(p==='3m'){S.repMode='range';S.repFrom=isoD(new Date(today.getFullYear(),today.getMonth()-2,1));S.repTo=isoD(today)}else{S.repMode='range';if(!S.repFrom){S.repFrom=isoD(new Date(today.getFullYear(),today.getMonth(),1));S.repTo=isoD(today)}S.repCustom=true}if(p!=='custom')S.repCustom=false;render()}
function repPeriod(){const ms=lastMonths(2);if(S.repMode==='range'&&S.repFrom&&S.repTo){const threeFrom=isoD(new Date(today.getFullYear(),today.getMonth()-2,1));return !S.repCustom&&S.repFrom===threeFrom&&S.repTo===isoD(today)?'3m':'custom'}return S.repMonth===ms[0]?'this':S.repMonth===ms[1]?'last':'month'}
function Reports(){const range=S.repMode==='range'&&S.repFrom&&S.repTo;const m=range?calcRange(S.repFrom,S.repTo):calc(S.repMonth);
 const prevKey=range?null:isoD(new Date(new Date(S.repMonth+'-01T00:00').getFullYear(),new Date(S.repMonth+'-01T00:00').getMonth()-1,1)).slice(0,7);const pm=prevKey?calc(prevKey):{inc:0,exp:0,by:{}};
 const left=m.inc-m.exp,rate=m.inc>0?Math.round(left/m.inc*100):null,per=repPeriod();
 const periodLabel=range?(sd(S.repFrom)+' – '+sd(S.repTo)):mLabel(S.repMonth)+(S.repMonth===curMk()?' so far':'');
 const schedText=('Review '+periodLabel+' report').replace(/'/g,"\\'");
 const six=lastMonths(6).reverse().map(k=>({k,...calc(k)})),mx=Math.max(1,...six.map(x=>Math.max(x.inc,x.exp)));
 const cats=[...new Set([...Object.keys(m.by),...Object.keys(pm.by)])].map(c=>({c,now:m.by[c]||0,before:pm.by[c]||0})).sort((a,b)=>b.now-a.now);
 const ins=[];if(prevKey){const ch=cats.filter(x=>x.before>0&&x.now>0).map(x=>({...x,d:Math.round((x.now-x.before)/x.before*100)}));const down=ch.filter(x=>x.d<0).sort((a,b)=>a.d-b.d)[0],up=ch.filter(x=>x.d>0).sort((a,b)=>b.d-a.d)[0];
  if(down)ins.push(['down','good',`You spent <strong>${Math.abs(down.d)}% less on ${esc(down.c.toLowerCase())}</strong> than in ${new Date(prevKey+'-01T00:00').toLocaleDateString('en-GB',{month:'long'})}.`]);
  if(up)ins.push(['up','bad',`<strong>${esc(up.c)} went up ${up.d}%</strong> compared with ${new Date(prevKey+'-01T00:00').toLocaleDateString('en-GB',{month:'long'})}.`]);}
 const cb=S.catBudgets||{};Object.keys(cb).forEach(c=>{if((m.by[c]||0)>cb[c])ins.push(['bell','bad',`<strong>${esc(c)} is ${money((m.by[c]||0)-cb[c])} over</strong> its budget.`])});
 if(rate!==null&&rate>=20)ins.push(['shield','good',`You kept <strong>${rate}% of your income</strong>. That's a healthy savings rate.`]);
 if(!ins.length)ins.push(['chart','',m.exp?'Keep adding expenses and WalletMV will point out what changed here.':'No spending recorded for this period yet.']);
 return `<div class="printhead" style="display:none">${esc(S.name||'Your statement')}<small style="display:block;color:var(--ink2);font-weight:400;margin-top:2px">Personal statement · ${periodLabel} · ${esc(S.cur)}</small></div>
 <div class="noprint">${nlHead('Reports',periodLabel,`${nlBtn('Reminder',`scheduleFromReport('money','','${schedText}')`,'cal')}${nlBtn('Excel','exportMoneyXLS()','down')}${nlBtn('Statement','printDoc()','receipt','primary')}`)}

 <label class="hide" for="rm">Pick a month</label><select id="rm" class="nl-month" onchange="if(!this.value)return;S.repMode='month';S.repCustom=false;S.repMonth=this.value;render()">${lastMonths(onFree()?2:12).map(k=>`<option value="${k}" ${!range&&k===S.repMonth?'selected':''}>${mLabel(k)}</option>`).join('')}${range?'<option selected value="">Pick a month</option>':''}</select>
 ${per==='custom'?`<div class="nl-inline" style="margin-top:12px"><div class="nl-field"><label for="rf">From</label><input id="rf" type="date" value="${S.repFrom}" onchange="S.repFrom=this.value;S.repCustom=true;render()"></div><div class="nl-field"><label for="rt">To</label><input id="rt" type="date" value="${S.repTo}" onchange="S.repTo=this.value;S.repCustom=true;render()"></div></div>`:''}</div>
 <div class="nl-kpis k2" style="margin-top:16px"><div class="nl-tile"><span class="tl">Income</span><span class="num good">${signed(m.inc,true)}</span></div><div class="nl-tile"><span class="tl">Expenses</span><span class="num bad">${signed(m.exp,false)}</span></div><div class="nl-tile"><span class="tl">Left over</span><span class="num">${money(left)}</span></div><div class="nl-tile"><span class="tl">Savings rate</span><span class="num">${rate===null?'—':rate+'%'}</span></div></div>
 <div class="nl-row2">
  <section class="nl-card"><div class="nl-ch"><h2>Income and expenses</h2><span class="nl-legend2" style="margin:0"><span><i style="background:var(--ok)"></i>Income</span><span><i style="background:var(--rose)"></i>Expenses</span></span></div>
   <div class="nl-pairs" role="img" aria-label="${esc('Last 6 months: '+six.map(x=>monShort(x.k)+' income '+shortMoney(x.inc)+', expenses '+shortMoney(x.exp)).join('; '))}">${six.map(x=>`<div class="c${x.k===curMk()?' on':''}"><div class="b"><i class="in" style="height:${x.inc>0?Math.max(3,x.inc/mx*100):0}%"></i><i class="out" style="height:${x.exp>0?Math.max(3,x.exp/mx*100):0}%"></i></div><small>${monShort(x.k)}</small></div>`).join('')}</div></section>
  <section class="nl-card"><h2>What changed</h2><div class="nl-ins">${ins.slice(0,4).map(([ic,tone,t])=>`<div><span class="nl-txi ${tone}">${IC(ic,18)}</span><span>${t}</span></div>`).join('')}</div></section>
 </div>
 <section class="nl-card" style="margin-top:16px"><h2>By category</h2>${cats.length?`<div class="nl-tt" role="table" aria-label="Spending by category"><div class="nl-tr cat head" role="row"><span role="columnheader">Category</span><span role="columnheader" class="r">${range?'This period':monShort(S.repMonth)}</span><span role="columnheader" class="r">${prevKey?monShort(prevKey):''}</span><span role="columnheader" class="r">${prevKey?'Change':''}</span></div>
  ${cats.map(x=>{const d=x.before>0?Math.round((x.now-x.before)/x.before*100):null;return `<div class="nl-tr cat" role="row"><span role="cell"><span class="nl-chip plain"><i style="background:${catCol(x.c)}"></i>${esc(x.c)}</span></span><span role="cell" class="r">${shortMoney(x.now)}</span><span role="cell" class="r muted">${prevKey?shortMoney(x.before):''}</span><span role="cell" class="r ${d===null?'muted':d>0?'bad':'good'}">${prevKey?(d===null?'new':(d>0?'+':d<0?'−':'')+Math.abs(d)+'%'):''}</span></div>`}).join('')}</div>`:`<p class="nl-empty">No spending recorded for this period.</p>`}</section>
 <p class="printonly sub" style="display:none;margin-top:16px">Generated by WalletMV on ${sd(isoD(today))}.</p>`}

 if(!(amt>0))return er('Enter an amount above zero.');if(amt>99999999)return er('Amount is too large.');if(!date)return er('Pick a valid date.');if(desc.length>120)return er('Keep the description under 120 characters.');
 if(S.edit){Object.assign(S.edit,{amt,cat,desc,date,accId});S.saved=S.edit}else{const t={id:Date.now(),date,desc,cat,amt,type:S.addType,accId};S.tx.unshift(t);S.saved=t;
