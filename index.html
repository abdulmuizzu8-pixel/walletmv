  <table>${d.gst?`<tr><td>Subtotal (excl. GST)</td><td class="bx-r">${bm(T.net)}</td></tr><tr><td>GST ${d.rate}%</td><td class="bx-r">${bm(T.tax)}</td></tr>`:''}<tr class="bx-big"><td>TOTAL</td><td class="bx-r">${bm(T.total)}</td></tr><tr><td>Paid by</td><td class="bx-r">${esc(d.method)}</td></tr></table>
  <div class="bx-hr"></div><div class="bx-c">${d.status==='paid'?'Thank you! Please come again.':'*** PAYMENT PENDING ***'}</div><div class="bx-c bx-qr" style="margin-top:8px">${qrSVG(verify,3)}</div><div class="bx-c bx-mut" style="font-size:10.5px">Powered by WalletMV</div></div>`;
 if(f==='tax')return `<div class="bill bill-tax"><div class="bx-top"><div class="bill-brand">${billLogo(54)}<div><h2 style="font-size:24px">${esc(me.name)}</h2><div class="bx-mut" style="font-size:13px">${[me.address,me.phone?'Tel '+me.phone:'',me.tin?'TIN '+me.tin:''].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div></div></div>
  <div class="bx-doc bx-r"><h1>${title}</h1><div class="bx-gold" style="font-weight:600">${esc(d.no)}</div></div></div>
  <div class="bx-meta"><div class="bx-box"><b>${lbl}</b><div style="font-weight:600">${esc(pt.name||'—')}</div>${pt.phone?`<div class="bx-mut">${esc(pt.phone)}</div>`:''}${pt.card?`<div class="bx-mut">Member card ${esc(pt.card)}</div>`:''}</div>
  <div class="bx-box"><b>Details</b><table style="font-size:13.5px"><tr><td style="padding:2px 0;border:0">Date</td><td class="bx-r" style="padding:2px 0;border:0">${bd(d.date)}</td></tr><tr><td style="padding:2px 0;border:0">Payment</td><td class="bx-r" style="padding:2px 0;border:0">${esc(d.method)}</td></tr><tr><td style="padding:2px 0;border:0">Status</td><td class="bx-r" style="padding:2px 0;border:0;font-weight:600;color:${d.status==='paid'?'#1F7A5C':'#B4434E'}">${d.status==='paid'?'Paid':'Unpaid'}</td></tr></table></div></div>
  <table><thead><tr><th style="width:44px">#</th><th>Description</th><th class="bx-r" style="width:70px">Qty</th><th class="bx-r" style="width:130px">Rate</th><th class="bx-r" style="width:140px">Amount</th></tr></thead><tbody>${items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.desc)}</td><td class="bx-r">${i.qty}</td><td class="bx-r">${bm(d.gst?i.price/(1+d.rate/100):i.price)}</td><td class="bx-r">${bm(d.gst?i.amt/(1+d.rate/100):i.amt)}</td></tr>`).join('')}</tbody></table>
  <table class="bx-tot"><tr><td>Subtotal</td><td class="bx-r">${bm(T.net)}</td></tr>${d.gst?`<tr><td>GST @ ${d.rate}%</td><td class="bx-r">${bm(T.tax)}</td></tr>`:`<tr><td class="bx-mut">GST</td><td class="bx-r bx-mut">Not charged</td></tr>`}<tr class="bx-g"><td>Total</td><td class="bx-r">${bm(T.total)}</td></tr></table>
  <div class="bx-words"><b>Amount in words:</b> ${wordsMVR(T.total)}</div>
  <div class="bx-foot"><div class="bx-mut">${d.gst?'This is a GST tax invoice. Prices include GST at '+d.rate+'%.':'No GST charged on this bill.'}<br>Thank you for your business.</div><div style="display:flex;gap:18px;align-items:flex-end"><div>${qrSVG(verify,3)}</div><div class="bx-sig">Authorised signature</div></div></div></div>`;
 if(f==='simple')return `<div class="bill bill-simple"><div class="bx-head">${billLogo(40)}<h1>${esc(me.name)}</h1><div class="bx-mut" style="font-size:12.5px">${[me.address,me.phone].filter(Boolean).map(esc).join(' · ')}</div><div style="margin-top:8px;letter-spacing:3px;font-weight:600;font-size:13px">${title}</div></div>
  <div class="bx-row"><span><b>No.</b> ${esc(d.no)}</span><span><b>Date</b> ${bd(d.date)}</span></div><div class="bx-row" style="margin-top:-4px"><span><b>${d.sale?'Name':'Paid to'}:</b> ${esc(pt.name||'')}</span></div>
  <table><thead><tr><th>Item</th><th class="bx-r" style="width:50px">Qty</th><th class="bx-r" style="width:110px">Amount</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.desc)}</td><td class="bx-r">${i.qty}</td><td class="bx-r">${bm(i.amt)}</td></tr>`).join('')}</tbody></table>
  ${d.gst?`<div class="bx-row bx-mut" style="margin-bottom:0"><span>Includes GST ${d.rate}%</span><span>${bm(T.tax)}</span></div>`:''}<div class="bx-grand"><span>Total</span><span>${bm(T.total)}</span></div>
  <div class="bx-row bx-mut" style="margin-top:22px"><span>${esc(d.method)}</span><span>Received by ____________</span></div></div>`;
 return `<div class="bill bill-paid"><div class="bx-band"><div class="bill-brand">${billLogo(42).replace(/#B8954F/g,'#E3CC92')}<div><h1>${esc(me.name)}</h1><small>${title}</small></div></div><div class="bx-r" style="font-size:13px">${esc(d.no)}<br>${bd(d.date)}</div></div>
  <div class="bx-stamp ${d.status==='paid'?'':'bx-pend'}">${d.status==='paid'?'PAID':'PENDING'}</div>
  <div class="bx-mut" style="font-size:13px">${d.sale?'Amount received':'Amount paid'}</div><div class="bx-amt">${bm(T.total)}</div><div class="bx-mut" style="font-style:italic;margin-bottom:14px">${wordsMVR(T.total)}</div>
  <div class="bx-line"><span>${d.sale?'Received from':'Paid to'}</span><b>${esc(pt.name||'—')}</b></div><div class="bx-line"><span>For</span><span>${items.map(i=>esc(i.desc)).join(', ')}</span></div>
  <div class="bx-line"><span>Payment method</span><span>${esc(d.method)}</span></div>${d.gst?`<div class="bx-line"><span>GST included</span><span>${bm(T.tax)} (${d.rate}%)</span></div>`:''}${me.tin?`<div class="bx-line"><span>TIN</span><span>${esc(me.tin)}</span></div>`:''}
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px"><div>${qrSVG(verify,3)}</div><div class="bx-r"><div style="border-top:1px solid #13202E;width:200px;padding-top:6px;text-align:center;font-size:12.5px">Signature</div></div></div></div>`}
function openBill(src,id,fmt){const t=src==='shop'?S.shopTx.find(x=>x.id===id):null;S.bill={src,id,fmt:fmt||S.billFmt||(src==='shop'&&t&&t.type==='income'?'thermal':'paid')};S.sheet=null;render()}
function billText(d){const T=billTotals(d);return `*${d.me.name}*\n${billTitle(d,'paid')} ${d.no}\nDate: ${bd(d.date)}\n${d.sale?'Customer':'Paid to'}: ${d.party.name||'-'}\n\n${d.items.map(i=>`• ${i.desc} x${i.qty||1} — ${bm((i.qty||1)*i.price)}`).join('\n')}\n${d.gst?`\nGST ${d.rate}% included: ${bm(T.tax)}`:''}\n*Total: ${bm(T.total)}*\nPaid by: ${d.method}\n\nThank you! — sent from WalletMV`}
function billDoc(d,f){const size=f==='thermal'?'80mm auto':f==='simple'?'A5':'A4';return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(billTitle(d,f))} ${esc(d.no)}</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;800&display=swap" rel="stylesheet"><style>${BILL_CSS}@page{size:${size};margin:${f==='thermal'?'0':'10mm'}}body{margin:0;padding:${f==='thermal'?'0':'16px'};background:#fff}</style></head><body>${billHTML(d,f)}<scr`+`ipt>window.onload=function(){setTimeout(function(){window.print()},400)}</scr`+`ipt></body></html>`}
function printBill(){const d=billData(),f=S.bill.fmt;if(!d)return;const doc=billDoc(d,f);const inFrame=!!(window.claude&&window.claude.use);
 if(!inFrame){try{const w=window.open('','_blank');if(w){w.document.open();w.document.write(doc);w.document.close();return}}catch(e){}}
 saveFile(('walletmv-'+d.no+'-'+f+'.html').replace(/[^\w.-]/g,''),doc,'text/html').then(ok=>{if(ok)toast('Saved — open the file to print or save as PDF')})}
function shareBill(){const d=billData();if(!d)return;const ph=String(d.party.phone||'').replace(/[^\d]/g,'');const a=document.createElement('a');a.href='https://wa.me/'+(ph.length>=7?ph:'')+'?text='+encodeURIComponent(billText(d));a.target='_blank';a.rel='noopener';document.body.appendChild(a);try{a.click()}catch(e){}a.remove()}
function saveBillDetails(){const p=billProfile(S.bill.src==='shop'?'shop':'money');['name','tin','address','phone'].forEach(k=>{const el=$('#bp_'+k);if(el)p[k]=el.value.trim()});toast('Bill details saved');render()}
function BillSheet(){if(!S.bill)return'';const d=billData();if(!d){S.bill=null;return''}const f=S.bill.fmt;const p=d.kind==='sub'?null:billProfile(d.kind==='shop'?'shop':'money');
 return `<div class="msheet billsheet" role="dialog" aria-label="Bill" onclick="if(event.target===this){S.bill=null;render()}"><div class="pan" style="max-width:900px;margin:0 auto;width:100%;max-height:92vh;overflow:auto">
 <div class="flex between" style="gap:10px;flex-wrap:wrap;margin-bottom:10px"><b style="font:600 1.35rem var(--head)">Bill · ${esc(d.no)}</b><div class="flex" style="gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="printBill()">${IC('receipt',15)} Print / PDF</button><button class="btn ghost sm" onclick="shareBill()">${IC('chat',15)} WhatsApp</button><button class="btn ghost sm" onclick="S.bill=null;render()">Close</button></div></div>
 <div class="billfmts" role="group" aria-label="Bill format">${BILL_FMTS.map(([k,l,h])=>`<button class="billfmt" aria-pressed="${f===k}" onclick="S.bill.fmt='${k}';S.billFmt='${k}';render()"><b>${l}</b><small>${h}</small></button>`).join('')}</div>
 ${p?`<details class="billdet"><summary>Details printed on the bill</summary><div class="grid2" style="gap:10px;margin-top:10px">${[['name','Business / your name'],['tin','TIN (tax filing)'],['address','Address'],['phone','Phone']].map(([k,l])=>`<div><label for="bp_${k}" style="margin-top:0">${l}</label><input id="bp_${k}" value="${esc(p[k]||'')}"></div>`).join('')}</div><button class="btn ghost sm" style="margin-top:10px" onclick="saveBillDetails()">Save details</button></details>`:''}
 <div class="billstage"><div class="billscale bs-${f}">${billHTML(d,f)}</div></div></div></div>`}

/* ============ INSTALLABLE APP ============ */
let _installEvt=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installApp(){S.sheet=null;
 if(isStandalone())return toast('WalletMV is already installed on this device');
 if(_installEvt){_installEvt.prompt();_installEvt.userChoice.then(r=>{if(r.outcome==='accepted')toast('WalletMV is being added to your home screen');_installEvt=null;render()});return}
 S.installHelp=true;render()}
function InstallHelp(){if(!S.installHelp)return'';const ios=isIOS();
 return `<div class="msheet" role="dialog" aria-label="Install WalletMV" onclick="if(event.target===this){S.installHelp=false;render()}"><div class="pan" style="max-width:520px;margin:0 auto;width:100%">
 <div class="flex between" style="margin-bottom:8px"><b style="font:600 1.3rem var(--head)">Put WalletMV on your phone</b><button class="btn ghost sm" onclick="S.installHelp=false;render()">Close</button></div>
 <p class="sub" style="margin:0 0 12px">WalletMV works like a normal app: its own icon, full screen, and it opens even with a weak connection.</p>
 <ol style="margin:0;padding-left:20px;line-height:1.9">${ios?'<li>Open <b>walletmv.com</b> in <b>Safari</b></li><li>Tap the <b>Share</b> button (square with an arrow)</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b></li>':'<li>Open <b>walletmv.com</b> in <b>Chrome</b></li><li>Tap the <b>⋮</b> menu at the top right</li><li>Choose <b>Install app</b> (or <b>Add to Home screen</b>)</li>'}</ol>
 <p class="sub" style="margin:12px 0 0;font-size:13px">On a computer, use the install icon at the right of the address bar in Chrome or Edge.</p></div></div>`}
function registerApp(){try{
 if(typeof window==='undefined'||!('serviceWorker' in navigator))return;
 if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
 if(window.claude||window.top!==window.self)return; // not inside previews
 navigator.serviceWorker.register('/sw.js').catch(()=>{});
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installEvt=e;render()});
 addEventListener('appinstalled',()=>{_installEvt=null;toast('WalletMV is installed — find it on your home screen')});
 }catch(e){}}
// opened from the home-screen icon → go straight to the app, not the website
try{if(/^\/join\/[A-Za-z0-9-]{3,40}$/.test(location.pathname)){S.page='money';S.joinCode=location.pathname.split('/')[2].toUpperCase();S.auFlash={m:'You\u2019ve been invited to share a WalletMV wallet. Log in, or create a free account, then let the person who invited you know.',k:'ok'};try{history.replaceState(null,'','/')}catch(e){}}}catch(e){}
try{const pth=location.pathname.replace(/\/+$/,''),LP={'/privacy':'privacy','/terms':'terms','/refund':'refund','/delete-account':'deletion','/disclaimer':'disclaimer'},h=(location.hash||'').slice(1);if(LP[pth])S.page=LP[pth];else if(['privacy','terms','refund','deletion','disclaimer'].includes(h))S.page=h}catch(e){}
try{if(/[?&]app=1\b/.test(location.search)||isStandalone()){const h=(location.hash||'').slice(1);if(h==='shop')S.page='shop';else if(S.page==='home'){S.page='money';if(h==='addx'||h==='addi')S.mview=h}}}catch(e){}
registerApp();
try{const q=location.search||'';if(/[?&]error=/.test(q)&&/error_description=/.test(q)&&!/error_code=otp_expired/.test(q)){S.auth='login';S.page='money';S.auFlash={m:/access_denied/.test(q)?'Google sign-in was cancelled. Try again, or log in with your email.':'Google sign-in didn\u2019t work this time. Please log in with your email for now.',k:'err'};history.replaceState(null,'',location.pathname)}}catch(e){}
try{const h=location.hash||'';if(/error_code=otp_expired|error=access_denied/.test(h)){S.auth='login';S.auFlash={m:'That email link has expired or was already used. Log in, or ask for a new link below.',k:'err'};if(S.page==='home')S.page='money';history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
if(walletAuth){walletAuth.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{const was=S.signed;
 if(event==='PASSWORD_RECOVERY'&&session?.user){S.email=session.user.email||'';S.recovery=true;S.signed=false;S.page='login';render();return}
 if(session?.user&&!S.recovery){S.email=session.user.email||'';S.name=session.user.user_metadata?.full_name||S.email.split('@')[0];S.signed=true;S.allAccess=false;if(event!=='TOKEN_REFRESHED')loadAccess();loadMyData(session.user);
  if(!was&&event==='SIGNED_IN'){if(S.page==='login'||S.page==='home'){S.page='money';S.mview='today'}if(/[#&](access_token|type=signup)/.test(location.hash)||/[?&]code=/.test(location.search)){const conf=/type=signup/.test(location.hash);try{history.replaceState(null,'',location.pathname+location.search.replace(/[?&]code=[^&]*/,'').replace(/^&/,'?'))}catch(e){}toast(conf?'Email confirmed. You are signed in.':'You are signed in.')}render()}else if(event==='INITIAL_SESSION')render()}
 else if(event==='SIGNED_OUT'){clearMyData();S.signed=false;S.allAccess=false;S.recovery=false;S.comp=null;S.isOwner=false;S.freeList=null}},0)});}

/* ============ STUDIO ============ */
if(walletAuth)loadPublicConfig();
render();
</script>
