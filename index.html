const SKIP_RE=/total|sub ?total|tax|gst|vat|change|cash|card|balance|discount|\btel\b|phone|invoice|receipt|date|time|thank|amount|paid|due|tin|bill no|qty|price/i;
function parseReceipt(text){const out=[];
 String(text||'').split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(l=>{
  if(SKIP_RE.test(l)||!/[a-z]{2}/i.test(l))return;
  const m=l.match(/^(.*?[a-z].*?)\s+(?:mvr|rf|\$)?\s*(\d[\d,]*(?:\.\d{1,2})?)\s*$/i);if(!m)return;
  let name=m[1].trim(),total=parseFloat(m[2].replace(/,/g,''));if(!(total>0)||total>500000)return;
  let qty=1;const q=name.match(/^(\d{1,3})\s*[x×*]?\s+(.+)$/i)||name.match(/^(.+?)\s+(\d{1,3})\s*[x×*@]\s*[\d.]*$/i);
  if(q){if(/^\d/.test(q[1])){qty=+q[1];name=q[2]}else{name=q[1];qty=+q[2]}}
  name=name.replace(/[^\w\s&'\-().\/]/g,'').trim().slice(0,48);if(name.length<2)return;
  out.push({name,qty:qty||1,price:Math.round(total/(qty||1)*100)/100,on:true})});
 return out}

const isMV=()=>S.shopProfile.region!=='intl';
const taxName=()=>isMV()?'GST':(S.shopProfile.taxLabel||'Tax');
const taxRate=()=>isMV()?8:(+S.defaultGst||0);
function shopGst(amt){const r=taxRate();return r?amt*r/(100+r):0}
function taxRateOptions(sel){
 const opts=isMV()?[[0,'0% (not registered)'],[8,'8% (general)'],[17,'17% (tourism)']]
  :[0,5,7,8,10,12,15,16,18,20,21,23,25].map(r=>[r,r===0?'0% (no tax)':r+'%']);
 if(!opts.some(o=>o[0]===sel))opts.push([sel,sel+'%']);
 return opts.map(o=>`<option value="${o[0]}" ${sel===o[0]?'selected':''}>${o[1]}</option>`).join('')}
function setShopRegion(r){
 S.shopProfile.region=r;
 if(r==='MV'){if(![0,8,17].includes(S.defaultGst))S.defaultGst=8;if(![0,8,17].includes(S.inv.tax))S.inv.tax=S.defaultGst}
 else if(S.repView==='gst')S.repView='sales';
 toast(r==='MV'?'Maldives: GST tools switched on':'Outside the Maldives: GST tools hidden');render()}
function shopCalcMonth(month){const cM=S.shopTx.filter(t=>mk(t.date)===month);
 const incM=cM.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);
 const expM=cM.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amt,0);
 const outGst=cM.filter(t=>t.type==='income'&&t.gst).reduce((a,t)=>a+shopGst(t.amt),0);
 return{incM,expM,outGst};
}
function shopCalc(){
 const month=curMk();const cM=S.shopTx.filter(t=>mk(t.date)===month);
 const c=shopCalcMonth(month);
 const by={};cM.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const from365=dAgo(365);
 const rolling=S.shopTx.filter(t=>t.type==='income'&&t.date>=from365).reduce((a,t)=>a+t.amt,0);
 const inGst=cM.filter(t=>t.type==='expense'&&t.gst).reduce((a,t)=>a+shopGst(t.amt),0);
 return{incM:c.incM,expM:c.expM,by,rolling,outGst:c.outGst,inGst,net:c.outGst-inGst};
}
function shopSalesBars(){const mx=Math.max(1,...lastMonths(6).map(k=>shopCalcMonth(k).incM));
 return lastMonths(6).reverse().map(k=>{const cm=shopCalcMonth(k);return `<div><div class="pair"><i style="height:${Math.max(2,cm.incM/mx*100)}%;background:var(--gold)"></i><i style="height:${Math.max(2,cm.outGst/mx*100)}%;background:var(--deep2)"></i></div>${new Date(k+'-01').toLocaleDateString('en-GB',{month:'short'})}</div>`}).join('')}
function loyaltyPoints(cid){const L=S.loyalty;if(!L||!L.on||!cid)return 0;
 const spent=S.shopTx.filter(t=>t.custId===cid&&t.type==='income'&&(t.status||'paid')==='paid').reduce((a,t)=>a+t.amt,0);
 const cu=S.customers.find(c=>c.id===cid);return Math.max(0,Math.floor(spent/L.earnPer)-((cu&&cu.redeemed)||0))}
function invRedeem(){const inv=S.inv,L=S.loyalty;if(!inv.custId)return toast('Choose a customer first');
 if((inv.charges||[]).some(c=>c.loyalty))return toast('Points are already applied to this bill');
 const pts=loyaltyPoints(inv.custId);if(pts<L.minRedeem)return toast('Needs at least '+L.minRedeem+' points to redeem');
 const val=Math.round(pts*L.pointValue*100)/100;inv.charges.push({id:Date.now(),name:'Loyalty points ('+pts+')',type:'fixed',value:-val,loyalty:pts,custId:inv.custId});

 if(!inv.docNo)inv.docNo=nextDocNo('invoice');const tax=sub*inv.tax/100;const extra=invChargesTotal(sub);
 const mo=(inv.charges||[]).find(c=>c.memberOffer);if(mo){const o=S.partners.find(x=>x.id===mo.memberOffer);if(o)o.uses=(o.uses||0)+1;inv.charges=inv.charges.filter(c=>c!==mo)}
 const dc=(inv.charges||[]).find(c=>c.discountId);if(dc){const d=S.discounts.find(x=>x.id===dc.discountId);if(d){d.status='used';d.used=isoD(today)}inv.charges=inv.charges.filter(c=>c!==dc)}
 const lc=(inv.charges||[]).find(c=>c.loyalty&&c.custId===inv.custId);if(lc){const cu=S.customers.find(c=>c.id===inv.custId);if(cu)cu.redeemed=(cu.redeemed||0)+lc.loyalty;inv.charges=inv.charges.filter(c=>c!==lc)}
 S.shopTx.unshift({id:Date.now(),date:isoD(today),desc:'Invoice '+inv.docNo+(inv.cust?' — '+inv.cust:''),cat:'Sales',type:'income',amt:sub+tax+extra,gst:inv.tax>0,custId:inv.custId,status:inv.status,invoiceNo:inv.docNo});

function localAnswer(q){q=q.toLowerCase();const st=prodStats(30);const L=[];
 if(/best|top|sold most|bestsell/.test(q)){const t=[...st].sort((a,b)=>b.rev-a.rev).slice(0,3);L.push('**Best sellers, last 30 days:**',...t.map((x,i)=>`- ${i+1}. ${x.p.name}: ${x.units} sold, ${money(x.rev)} revenue, ${money(x.profit)} profit`))}
 else if(/reorder|restock|order|run out|stock/.test(q)){const t=S.products.filter(needsReorder).map(p=>({p,st:statOf(p)}));L.push(t.length?'**Reorder these:**':'Nothing needs reordering right now.',...t.map(x=>`- ${x.p.name}: ${x.p.stock} left, lasts ${fmtDays(x.st.daysLeft)}. Order about ${reorderQty(x.p)} from ${supName(x.p.supplierId)}.`))}
 else if(/slow|not selling|dead|aren't selling|stuck/.test(q)){const t=st.filter(x=>x.p.stock>0&&x.sellThrough<15);L.push(t.length?'**Slow movers:**':'Everything is selling at a healthy pace.',...t.map(x=>`- ${x.p.name}: ${x.units} sold in 30 days, ${x.p.stock} on the shelf (${money(x.p.stock*x.p.cost)} at cost). Try a bundle or a small discount.`))}
 else if(/profit|margin|last month|compare/.test(q)){const c=shopCalc(),prev=shopCalcMonth(lastMonths(2)[1]);const ch=prev.incM?Math.round((c.incM-prev.incM)/prev.incM*100):null;L.push(`**This month:** sales ${money(c.incM)}, expenses ${money(c.expM)}, profit ${money(c.incM-c.expM)}.`,`**Last month:** sales ${money(prev.incM)}.`+(ch!==null?` Sales are ${ch>=0?'up':'down'} ${Math.abs(ch)}%.`:''))}
 else if(/owe|outstanding|unpaid|pending/.test(q)){const t=S.customers.map(cu=>({cu,o:custStats(cu.id).outstanding})).filter(x=>x.o>0).sort((a,b)=>b.o-a.o);L.push(t.length?'**Customers with unpaid bills:**':'Nobody owes you money right now.',...t.map(x=>`- ${x.cu.name}: ${money(x.o)}`))}

 return Object.values(m).map(r=>{const perDay=r.units/days;const sup=S.suppliers.find(x=>x.id===r.p.supplierId);const lead=sup?sup.leadDays:3;

   sellThrough:(r.units+r.p.stock)?r.units/(r.units+r.p.stock)*100:0,
   suggest:perDay>0?Math.max(0,Math.ceil(perDay*(lead+14)-r.p.stock)):0}})}

 const supRows=[...outRows.map(t=>({Date:t.date,Description:t.desc,Type:'Output (sale)','Value excl. GST':Math.round((t.amt-shopGst(t.amt))*100)/100,GST:Math.round(shopGst(t.amt)*100)/100,'Value incl. GST':t.amt})),

function calc(month){const c=S.tx.filter(t=>mk(t.date)===month);const inc=c.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);const by={};c.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);const exp=Object.values(by).reduce((a,b)=>a+b,0);return{inc,exp,by}}
function calcRange(from,to){const c=S.tx.filter(t=>t.date>=from&&t.date<=to);const inc=c.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);const by={};c.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);const exp=Object.values(by).reduce((a,b)=>a+b,0);return{inc,exp,by}}
function setRepMode(mode){S.repMode=mode;if(mode==='range'&&!S.repFrom){const d=new Date();S.repFrom=isoD(new Date(d.getFullYear(),d.getMonth(),1));S.repTo=isoD(today)}render()}
function shopCalcRange(from,to){const cM=S.shopTx.filter(t=>t.date>=from&&t.date<=to);
 const incM=cM.filter(t=>t.type==='income').reduce((a,t)=>a+t.amt,0);
 const expM=cM.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amt,0);
 const outGst=cM.filter(t=>t.type==='income'&&t.gst).reduce((a,t)=>a+shopGst(t.amt),0);
 const by={};cM.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 return{incM,expM,outGst,by}}
function setShopRepMode(mode){S.shopRepMode=mode;if(mode==='range'&&!S.shopRepFrom){const d=new Date();S.shopRepFrom=isoD(new Date(d.getFullYear(),d.getMonth(),1));S.shopRepTo=isoD(today)}render()}

 return `<div class="flex" style="gap:24px"><div class="donut" role="img" aria-label="Spending by category" style="background:conic-gradient(${st})"></div><div class="legend">${Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<span><b style="font-weight:400"><i style="background:${CATC[k]||'#9AAAB0'}"></i>${k}</b><span style="color:var(--ink2)">${Math.round(v/tot*100)}%</span></span>`).join('')}</div></div>`}

function scanBill(file){
 if(!file)return;
 const st=$('#scanStatus');
 if(st)st.innerHTML='<small style="color:var(--ink2)">Reading the image…</small>';
 if(typeof Tesseract==='undefined'){if(st)st.innerHTML='<small class="err" style="margin:0">Scanning didn\'t load — enter the bill by hand.</small>';return}
 Tesseract.recognize(file,'eng').then(({data:{text}})=>{
  const nums=[...text.matchAll(/\d[\d,]*\.\d{2}|\d{3,}/g)].map(m=>parseFloat(m[0].replace(/,/g,''))).filter(n=>n>0&&n<1000000);
  const amt=nums.length?Math.max(...nums):null;
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>2&&/[a-zA-Z]/.test(l)&&!/total|amount|due|invoice|bill|receipt/i.test(l));
  const name=(lines[0]||'Scanned bill').slice(0,40);
  const dm=text.match(/\b([0-3]?\d)[\/\-.]([01]?\d)(?:[\/\-.]\d{2,4})?\b/);
  const due=dm?Math.min(31,Math.max(1,parseInt(dm[1],10))):today.getDate();
  if($('#bn'))$('#bn').value=name;
  if($('#ba')&&amt)$('#ba').value=amt;
  if($('#bd'))$('#bd').value=due;
  if(st)st.innerHTML='<small style="color:var(--ok)">Read the image — check the details below, then Add bill.</small>';
 }).catch(()=>{if(st)st.innerHTML='<small class="err" style="margin:0">Could not read that image — enter the bill by hand.</small>'});
}

 S.shopType='expense';render();
 const st=$('#shopScanStatus');
 if(st)st.innerHTML='<small style="color:var(--ink2)">Reading the image…</small>';
 if(typeof Tesseract==='undefined'){if(st)st.innerHTML='<small class="err" style="margin:0">Scanning didn\'t load — enter it by hand.</small>';return}
 Tesseract.recognize(file,'eng').then(({data:{text}})=>{

function trendSVG(){const ks=lastMonths(6).reverse(),d=ks.map(k=>calc(k)),mx=Math.max(1,...d.map(x=>Math.max(x.inc,x.exp)))*1.1;
 const W=520,H=200,L=44,B=26,T=10,xs=k=>L+k*(W-L-14)/(ks.length-1),ys=v=>T+(H-T-B)*(1-v/mx);
 const line=(f,c)=>{const pts=d.map((x,k)=>[xs(k),ys(f(x))]);return `<path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L')} L${xs(ks.length-1)} ${H-B} L${L} ${H-B}Z" fill="${c}" fill-opacity=".08"/><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('')}`};
 const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-6}" y1="${ys(mx/1.1*f)}" y2="${ys(mx/1.1*f)}" stroke="var(--line)"/><text x="${L-8}" y="${ys(mx/1.1*f)+4}" text-anchor="end" font-size="11" fill="var(--ink2)">${Math.round(mx/1.1*f/1000)}k</text>`).join('');
 const lab=ks.map((k,n)=>`<text x="${xs(n)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--ink2)">${new Date(k+'-01T00:00').toLocaleDateString('en-GB',{month:'short'})}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Income and expenses, last 6 months">${grid}${line(x=>x.inc,'#1F7A5C')}${line(x=>x.exp,'#B4434E')}${lab}</svg>`}

function wordsMVR(n){const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
 const w=x=>x<20?a[x]:x<100?t[Math.floor(x/10)]+(x%10?'-'+a[x%10]:''):x<1000?a[Math.floor(x/100)]+' hundred'+(x%100?' and '+w(x%100):''):x<1e6?w(Math.floor(x/1000))+' thousand'+(x%1000?(x%1000<100?' and ':' ')+w(x%1000):''):w(Math.floor(x/1e6))+' million'+(x%1e6?' '+w(x%1e6):'');
 const r=Math.floor(Math.abs(n)+1e-9),l=Math.round((Math.abs(n)-r)*100);const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
 return cap((r?w(r):'zero')+' rufiyaa'+(l?' and '+w(l)+' laari':'')+' only')}

function billData(){const b=S.bill;if(!b)return null;const rate=Number(S.inv&&S.inv.tax)||8;
 if(b.src==='shop'){const t=S.shopTx.find(x=>x.id===b.id);if(!t)return null;const sale=t.type==='income';
  if(!t.billNo){S.docCounters.bill=S.docCounters.bill||7001;t.billNo=(sale?'BILL-':'PV-')+S.docCounters.bill++}
  const c=t.custId?S.customers.find(x=>x.id===t.custId):null;const p=S.shopProfile;
  const party=sale?{name:c?c.name:'Walk-in customer',phone:c?c.phone:'',card:c?c.card:''}:{name:t.supplier||t.desc,phone:''};
  return {kind:'shop',sale,no:t.billNo,date:t.date,me:{name:p.name||'Your shop',tin:p.tin||'',address:p.address||'',phone:p.phone||''},party,
   items:(t.items&&t.items.length?t.items:[{desc:t.desc||t.cat,qty:1,price:t.amt}]),total:t.amt,gst:!!t.gst,rate,method:t.method||(sale?'Cash':'Bank transfer'),status:t.status||'paid',cat:t.cat}}
 if(b.src==='money'){const t=S.tx.find(x=>x.id===b.id);if(!t)return null;const sale=t.type==='income';const acc=S.accounts.find(a=>a.id===t.accId);const p=billProfile('money');
  return {kind:'money',sale,no:'WM-'+String(t.id).padStart(5,'0'),date:t.date,me:{name:p.name||S.name,tin:p.tin,address:p.address,phone:p.phone},party:{name:sale?(t.desc||'Payer'):(t.desc||'Payee'),phone:''},
   items:[{desc:t.desc||t.cat,qty:1,price:t.amt}],total:t.amt,gst:false,rate,method:acc?acc.name:'Cash',status:'paid',cat:t.cat}}
 if(b.src==='sub'){const x=S.pendingSubs.find(y=>y.id===b.id);if(!x)return null;const pl=planInfo(x.plan);
  return {kind:'sub',sale:true,no:x.ref,date:x.requestedAt,me:{name:'WalletMV',tin:'',address:'Malé, Maldives',phone:S.supportWhatsapp},party:{name:S.name,phone:'',card:''},

  <table>${items.map(i=>`<tr><td colspan="2">${esc(i.desc)}</td></tr><tr><td class="bx-mut">&nbsp;${i.qty} x ${bm(i.price).replace('MVR ','')}</td><td class="bx-r">${bm(i.amt).replace('MVR ','')}</td></tr>`).join('')}</table><div class="bx-hr"></div>
  <table>${d.gst?`<tr><td>Subtotal (excl. GST)</td><td class="bx-r">${bm(T.net)}</td></tr><tr><td>GST ${d.rate}%</td><td class="bx-r">${bm(T.tax)}</td></tr>`:''}<tr class="bx-big"><td>TOTAL</td><td class="bx-r">${bm(T.total)}</td></tr><tr><td>Paid by</td><td class="bx-r">${esc(d.method)}</td></tr></table>
  <div class="bx-hr"></div><div class="bx-c">${d.status==='paid'?'Thank you! Please come again.':'*** PAYMENT PENDING ***'}</div><div class="bx-c bx-qr" style="margin-top:8px">${qrSVG(verify,3)}</div><div class="bx-c bx-mut" style="font-size:10.5px">Powered by WalletMV</div></div>`;
 if(f==='tax')return `<div class="bill bill-tax"><div class="bx-top"><div class="bill-brand">${billLogo(54)}<div><h2 style="font-size:24px">${esc(me.name)}</h2><div class="bx-mut" style="font-size:13px">${[me.address,me.phone?'Tel '+me.phone:'',me.tin?'TIN '+me.tin:''].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div></div></div>
  <div class="bx-doc bx-r"><h1>${title}</h1><div class="bx-gold" style="font-weight:600">${esc(d.no)}</div></div></div>
  <div class="bx-meta"><div class="bx-box"><b>${lbl}</b><div style="font-weight:600">${esc(pt.name||'—')}</div>${pt.phone?`<div class="bx-mut">${esc(pt.phone)}</div>`:''}${pt.card?`<div class="bx-mut">Member card ${esc(pt.card)}</div>`:''}</div>
  <div class="bx-box"><b>Details</b><table style="font-size:13.5px"><tr><td style="padding:2px 0;border:0">Date</td><td class="bx-r" style="padding:2px 0;border:0">${bd(d.date)}</td></tr><tr><td style="padding:2px 0;border:0">Payment</td><td class="bx-r" style="padding:2px 0;border:0">${esc(d.method)}</td></tr><tr><td style="padding:2px 0;border:0">Status</td><td class="bx-r" style="padding:2px 0;border:0;font-weight:600;color:${d.status==='paid'?'#1F7A5C':'#B4434E'}">${d.status==='paid'?'Paid':'Unpaid'}</td></tr></table></div></div>
  <table><thead><tr><th style="width:44px">#</th><th>Description</th><th class="bx-r" style="width:70px">Qty</th><th class="bx-r" style="width:130px">Rate</th><th class="bx-r" style="width:140px">Amount</th></tr></thead><tbody>${items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.desc)}</td><td class="bx-r">${i.qty}</td><td class="bx-r">${bm(d.gst?i.price/(1+d.rate/100):i.price)}</td><td class="bx-r">${bm(d.gst?i.amt/(1+d.rate/100):i.amt)}</td></tr>`).join('')}</tbody></table>
  <table class="bx-tot"><tr><td>Subtotal</td><td class="bx-r">${bm(T.net)}</td></tr>${d.gst?`<tr><td>GST @ ${d.rate}%</td><td class="bx-r">${bm(T.tax)}</td></tr>`:`<tr><td class="bx-mut">GST</td><td class="bx-r bx-mut">Not charged</td></tr>`}<tr class="bx-g"><td>Total</td><td class="bx-r">${bm(T.total)}</td></tr></table>
  <div class="bx-words"><b>Amount in words:</b> ${wordsMVR(T.total)}</div>
  <div class="bx-foot"><div class="bx-mut">${d.gst?'This is a GST tax invoice. Prices include GST at '+d.rate+'%.':'No GST charged on this bill.'}<br>Thank you for your business.</div><div style="display:flex;gap:18px;align-items:flex-end"><div>${qrSVG(verify,3)}</div><div class="bx-sig">Authorised signature</div></div></div></div>`;
 if(f==='simple')return `<div class="bill bill-simple"><div class="bx-head">${billLogo(40)}<h1>${esc(me.name)}</h1><div class="bx-mut" style="font-size:12.5px">${[me.address,me.phone].filter(Boolean).map(esc).join(' · ')}</div><div style="margin-top:8px;letter-spacing:3px;font-weight:600;font-size:13px">${title}</div></div>
  <div class="bx-row"><span><b>No.</b> ${esc(d.no)}</span><span><b>Date</b> ${bd(d.date)}</span></div><div class="bx-row" style="margin-top:-4px"><span><b>${d.sale?'Name':'Paid to'}:</b> ${esc(pt.name||'')}</span></div>
  <table><thead><tr><th>Item</th><th class="bx-r" style="width:50px">Qty</th><th class="bx-r" style="width:110px">Amount</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.desc)}</td><td class="bx-r">${i.qty}</td><td class="bx-r">${bm(i.amt)}</td></tr>`).join('')}</tbody></table>
  ${d.gst?`<div class="bx-row bx-mut" style="margin-bottom:0"><span>Includes GST ${d.rate}%</span><span>${bm(T.tax)}</span></div>`:''}<div class="bx-grand"><span>Total</span><span>${bm(T.total)}</span></div>
  <div class="bx-row bx-mut" style="margin-top:22px"><span>${esc(d.method)}</span><span>Received by ____________</span></div></div>`;
 return `<div class="bill bill-paid"><div class="bx-band"><div class="bill-brand">${billLogo(42).replace(/#B8954F/g,'#E3CC92')}<div><h1>${esc(me.name)}</h1><small>${title}</small></div></div><div class="bx-r" style="font-size:13px">${esc(d.no)}<br>${bd(d.date)}</div></div>
  <div class="bx-stamp ${d.status==='paid'?'':'bx-pend'}">${d.status==='paid'?'PAID':'PENDING'}</div>
  <div class="bx-mut" style="font-size:13px">${d.sale?'Amount received':'Amount paid'}</div><div class="bx-amt">${bm(T.total)}</div><div class="bx-mut" style="font-style:italic;margin-bottom:14px">${wordsMVR(T.total)}</div>
  <div class="bx-line"><span>${d.sale?'Received from':'Paid to'}</span><b>${esc(pt.name||'—')}</b></div><div class="bx-line"><span>For</span><span>${items.map(i=>esc(i.desc)).join(', ')}</span></div>
  <div class="bx-line"><span>Payment method</span><span>${esc(d.method)}</span></div>${d.gst?`<div class="bx-line"><span>GST included</span><span>${bm(T.tax)} (${d.rate}%)</span></div>`:''}${me.tin?`<div class="bx-line"><span>TIN</span><span>${esc(me.tin)}</span></div>`:''}
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px"><div>${qrSVG(verify,3)}</div><div class="bx-r"><div style="border-top:1px solid #13202E;width:200px;padding-top:6px;text-align:center;font-size:12.5px">Signature</div></div></div></div>`}
function openBill(src,id,fmt){const t=src==='shop'?S.shopTx.find(x=>x.id===id):null;S.bill={src,id,fmt:fmt||S.billFmt||(src==='shop'&&t&&t.type==='income'?'thermal':'paid')};S.sheet=null;render()}
function billText(d){const T=billTotals(d);return `*${d.me.name}*\n${billTitle(d,'paid')} ${d.no}\nDate: ${bd(d.date)}\n${d.sale?'Customer':'Paid to'}: ${d.party.name||'-'}\n\n${d.items.map(i=>`• ${i.desc} x${i.qty||1} — ${bm((i.qty||1)*i.price)}`).join('\n')}\n${d.gst?`\nGST ${d.rate}% included: ${bm(T.tax)}`:''}\n*Total: ${bm(T.total)}*\nPaid by: ${d.method}\n\nThank you! — sent from WalletMV`}
function billDoc(d,f){const size=f==='thermal'?'80mm auto':f==='simple'?'A5':'A4';return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(billTitle(d,f))} ${esc(d.no)}</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;800&display=swap" rel="stylesheet"><style>${BILL_CSS}@page{size:${size};margin:${f==='thermal'?'0':'10mm'}}body{margin:0;padding:${f==='thermal'?'0':'16px'};background:#fff}</style></head><body>${billHTML(d,f)}<scr`+`ipt>window.onload=function(){setTimeout(function(){window.print()},400)}</scr`+`ipt></body></html>`}
function printBill(){const d=billData(),f=S.bill.fmt;if(!d)return;const doc=billDoc(d,f);const inFrame=!!(window.claude&&window.claude.use);
 if(!inFrame){try{const w=window.open('','_blank');if(w){w.document.open();w.document.write(doc);w.document.close();return}}catch(e){}}
 saveFile(('walletmv-'+d.no+'-'+f+'.html').replace(/[^\w.-]/g,''),doc,'text/html').then(ok=>{if(ok)toast('Saved — open the file to print or save as PDF')})}
function shareBill(){const d=billData();if(!d)return;const ph=String(d.party.phone||'').replace(/[^\d]/g,'');const a=document.createElement('a');a.href='https://wa.me/'+(ph.length>=7?ph:'')+'?text='+encodeURIComponent(billText(d));a.target='_blank';a.rel='noopener';document.body.appendChild(a);try{a.click()}catch(e){}a.remove()}
function saveBillDetails(){const p=billProfile(S.bill.src==='shop'?'shop':'money');['name','tin','address','phone'].forEach(k=>{const el=$('#bp_'+k);if(el)p[k]=el.value.trim()});toast('Bill details saved');render()}
function BillSheet(){if(!S.bill)return'';const d=billData();if(!d){S.bill=null;return''}const f=S.bill.fmt;const p=d.kind==='sub'?null:billProfile(d.kind==='shop'?'shop':'money');
 return `<div class="msheet billsheet" role="dialog" aria-label="Bill" onclick="if(event.target===this){S.bill=null;render()}"><div class="pan" style="max-width:900px;margin:0 auto;width:100%;max-height:92vh;overflow:auto">
 <div class="flex between" style="gap:10px;flex-wrap:wrap;margin-bottom:10px"><b style="font:600 1.35rem var(--head)">Bill · ${esc(d.no)}</b><div class="flex" style="gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="printBill()">${IC('receipt',15)} Print / PDF</button><button class="btn ghost sm" onclick="shareBill()">${IC('chat',15)} WhatsApp</button><button class="btn ghost sm" onclick="S.bill=null;render()">Close</button></div></div>
 <div class="billfmts" role="group" aria-label="Bill format">${BILL_FMTS.map(([k,l,h])=>`<button class="billfmt" aria-pressed="${f===k}" onclick="S.bill.fmt='${k}';S.billFmt='${k}';render()"><b>${l}</b><small>${h}</small></button>`).join('')}</div>
 ${p?`<details class="billdet"><summary>Details printed on the bill</summary><div class="grid2" style="gap:10px;margin-top:10px">${[['name','Business / your name'],['tin','TIN (tax filing)'],['address','Address'],['phone','Phone']].map(([k,l])=>`<div><label for="bp_${k}" style="margin-top:0">${l}</label><input id="bp_${k}" value="${esc(p[k]||'')}"></div>`).join('')}</div><button class="btn ghost sm" style="margin-top:10px" onclick="saveBillDetails()">Save details</button></details>`:''}
 <div class="billstage"><div class="billscale bs-${f}">${billHTML(d,f)}</div></div></div></div>`}

/* ============ INSTALLABLE APP ============ */
let _installEvt=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installApp(){S.sheet=null;
 if(isStandalone())return toast('WalletMV is already installed on this device');
 if(_installEvt){_installEvt.prompt();_installEvt.userChoice.then(r=>{if(r.outcome==='accepted')toast('WalletMV is being added to your home screen');_installEvt=null;render()});return}
 S.installHelp=true;render()}
function InstallHelp(){if(!S.installHelp)return'';const ios=isIOS();
 return `<div class="msheet" role="dialog" aria-label="Install WalletMV" onclick="if(event.target===this){S.installHelp=false;render()}"><div class="pan" style="max-width:520px;margin:0 auto;width:100%">
 <div class="flex between" style="margin-bottom:8px"><b style="font:600 1.3rem var(--head)">Put WalletMV on your phone</b><button class="btn ghost sm" onclick="S.installHelp=false;render()">Close</button></div>
 <p class="sub" style="margin:0 0 12px">WalletMV works like a normal app: its own icon, full screen, and it opens even with a weak connection.</p>
 <ol style="margin:0;padding-left:20px;line-height:1.9">${ios?'<li>Open <b>walletmv.com</b> in <b>Safari</b></li><li>Tap the <b>Share</b> button (square with an arrow)</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b></li>':'<li>Open <b>walletmv.com</b> in <b>Chrome</b></li><li>Tap the <b>⋮</b> menu at the top right</li><li>Choose <b>Install app</b> (or <b>Add to Home screen</b>)</li>'}</ol>
 <p class="sub" style="margin:12px 0 0;font-size:13px">On a computer, use the install icon at the right of the address bar in Chrome or Edge.</p></div></div>`}
function registerApp(){try{
 if(typeof window==='undefined'||!('serviceWorker' in navigator))return;
 if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
 if(window.claude||window.top!==window.self)return; // not inside previews
 navigator.serviceWorker.register('/sw.js').catch(()=>{});
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installEvt=e;render()});
 addEventListener('appinstalled',()=>{_installEvt=null;toast('WalletMV is installed — find it on your home screen')});
 }catch(e){}}
// opened from the home-screen icon → go straight to the app, not the website
try{if(/[?&]app=1\b/.test(location.search)||isStandalone()){const h=(location.hash||'').slice(1);if(h==='shop')S.page='shop';else if(S.page==='home'){S.page='money';if(h==='addx'||h==='addi')S.mview=h}}}catch(e){}
registerApp();

/* ============ STUDIO ============ */
render();
</script>
</body>
</html>
